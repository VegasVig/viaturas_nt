function validateRetirada(){
  const p=[];
  if(!WZ.motoristaId)p.push("Selecione o motorista");
  if(!WZ.veiculoId)p.push("Selecione o veículo");
  if(!WZ.destinoNome)p.push("Informe o destino");
  if(!WZ.kmInicial)p.push("Informe o KM inicial");
  else if(WZ.veiculoId && validarKm(WZ.veiculoId,WZ.kmInicial)) p.push("Quilometragem inválida (menor que a última registrada: "+fmtKm(kmAtual(WZ.veiculoId))+")");
  if(WZ.veiculoId && retiradaAberta(WZ.veiculoId)) p.push("Este veículo já está retirado — escolha outro");
  const chkVazio=CHECKLIST_ITENS.some((_,i)=>!WZ.checklist[i]||!WZ.checklist[i].v);
  if(chkVazio)p.push("Complete o checklist");
  const chkPbSemDesc=CHECKLIST_ITENS.some((_,i)=>WZ.checklist[i]&&WZ.checklist[i].v==="pb"&&!WZ.checklist[i].desc);
  if(chkPbSemDesc)p.push("Descreva os problemas do checklist");
  if(!WZ.niveisAgua||!WZ.niveisOleo)p.push("Informe níveis de água e óleo");
  const fotoFalta=FOTOS_OBRIGATORIAS.some(k=>!WZ.fotos[k]);
  if(fotoFalta)p.push("Tire as fotos obrigatórias (frente, traseira, laterais e painel)");
  if(WZ.avaria.tem&&!WZ.avaria.desc)p.push("Descreva a avaria");
  if(!WZ.termo)p.push("Aceite o termo de responsabilidade");
  return p;
}

async function finalizarRetirada(){
  // 1) confirma com o estado MAIS RECENTE da frota (outro celular pode ter retirado)
  await atualizarAntes();
  const v=veiculo(WZ.veiculoId);
  if(!v){toast("Veículo não encontrado");return;}
  const ab=retiradaAberta(v.id);
  if(ab){ alert(msgEmUso(v,ab)); WZ.veiculoId=""; WZ.step=RET_STEPS.indexOf("Viatura"); wzSave(); renderWizard(); return; }
  if(statusVeiculo(v)!=="Disponível"){ toast("Veículo em "+statusVeiculo(v)+" — ajuste o status antes de retirar"); return; }
  const erroKm=validarKm(v.id, WZ.kmInicial);
  if(erroKm){ alert(erroKm); WZ.step=RET_STEPS.indexOf("KM inicial"); wzSave(); renderWizard(); return; }

  // 2) fotos
  const rid=uid("r");
  const fotoRefs={};
  let soLocal=0, totalFotos=0;
  const guarda=async(key,dataUrl)=>{ totalFotos++; const ref=await photoPut(key,dataUrl); if(!/^https?:\/\//.test(ref)) soLocal++; return ref; };
  for(const [k] of FOTOS_RET){ if(WZ.fotos[k]){const key=rid+"_ret_"+k;fotoRefs[k]=await guarda(key,WZ.fotos[k]);} }
  const avariaRefs=[];
  if(WZ.avaria && WZ.avaria.fotos && WZ.avaria.fotos.length){
    for(let i=0;i<WZ.avaria.fotos.length;i++){ avariaRefs.push(await guarda(rid+"_ret_avaria"+i,WZ.avaria.fotos[i])); }
  }
  const chk={};
  for(const i in WZ.checklist){ const c={...WZ.checklist[i]}; if(c.foto){c.foto=await guarda(rid+"_ret_chk"+i,c.foto);} chk[i]=c; }
  if(apiConfigurada() && soLocal>0){ toast("⚠ "+soLocal+" de "+totalFotos+" fotos não subiram à nuvem — ficaram no aparelho"); }

  // 3) registro completo (dados do veículo e do motorista gravados junto,
  //    para o histórico nunca perder a referência)
  const agora=nowISO(), mot=motorista(WZ.motoristaId);
  const reg={id:rid,veiculoId:v.id,placa:v.placa,veiculoInterno:v.interno,
    motoristaId:WZ.motoristaId,motoristaNome:mot?.nome||"",
    destinoId:WZ.destinoId,destinoNome:WZ.destinoNome,finalidade:WZ.finalidade,obs:WZ.obs||"",
    kmInicial:+WZ.kmInicial,nivelComb:WZ.nivelComb,niveisAgua:WZ.niveisAgua,niveisOleo:WZ.niveisOleo,
    checklist:chk,fotos:fotoRefs,avaria:{tem:WZ.avaria.tem,desc:WZ.avaria.desc,areas:[...(WZ.avaria.areas||[])],fotosRefs:avariaRefs},
    lat:WZ.lat,lng:WZ.lng,data:agora,
    registradoPor:SESSION.nome,registradoPorId:SESSION.id,registradoPorTipo:SESSION.tipo,
    termoAceite:{nome:mot?.nome,data:agora,usuario:SESSION.nome},
    devolvida:false};
  const extras=[];
  let occ=null;
  if(WZ.avaria.tem){
    occ={id:uid("o"),veiculoId:v.id,motoristaId:WZ.motoristaId,tipo:"Avaria",
      data:agora,local:WZ.destinoNome,descricao:WZ.avaria.desc+" | Áreas: "+WZ.avaria.areas.join(", "),status:"Aberta",fotos:avariaRefs};
    extras.push({aba:"ocorrencias",registro:occ});
  }
  const aud={id:uid("a"),usuario:SESSION.nome,nivel:SESSION.nivel,data:agora,acao:"Retirou viatura",
    registro:v.interno+" · "+v.placa+" · "+(mot?.nome||"")+" · KM "+fmtNum(reg.kmInicial)};
  extras.push({aba:"auditoria",registro:aud});

  // 4) grava no SERVIDOR com trava — ele recusa se o veículo já estiver retirado
  let offline=false;
  if(apiConfigurada()){
    try{
      let r;
      try{ r=await api("retirar",{retirada:reg,extras}); }
      catch(e2){ if(!backendAntigo(e2)) throw e2;
        const vv0=Object.assign({},veiculo(v.id),{status:"Em uso",km:Math.max(+v.km||0,+reg.kmInicial),kmEm:agora,motoristaAtualId:reg.motoristaId,retiradaAtualId:reg.id});
        await api("pushMuitos",{itens:[{aba:"retiradas",registro:reg},{aba:"veiculos",registro:vv0},...extras]}); r={veiculo:vv0}; }
      if(r.veiculo){ const i=DB.veiculos.findIndex(x=>x.id===v.id); if(i>=0){ DB.veiculos[i]=r.veiculo; marcarSync("veiculos",[r.veiculo]); } }
      marcarSync("retiradas",[reg]);
      extras.forEach(x=>marcarSync(x.aba,[x.registro]));
    }catch(e){
      if(!erroDeRede(e)){
        const d=e.dados||{};
        if(d.erro==="VEICULO_EM_USO"){
          await atualizarAntes();
          const c=d.conflito||{};
          alert((v.interno+" · "+v.placa)+" acabou de ser retirado em outro aparelho.\n\nMotorista: "+(c.motoristaNome||"—")+
            "\nDesde: "+dtBR(c.data)+"\n\nEscolha outro veículo.");
          WZ.veiculoId=""; WZ.step=RET_STEPS.indexOf("Viatura"); wzSave(); renderWizard(); return;
        }
        if(d.erro==="KM_INVALIDO"){
          alert(MSG_KM_INVALIDO+"\n\nÚltima registrada: "+fmtKm(d.kmAtual));
          WZ.step=RET_STEPS.indexOf("KM inicial"); wzSave(); renderWizard(); return;
        }
        alert("O servidor recusou a retirada: "+e.message); return;
      }
      offline=true;     // sem internet: grava no aparelho e envia depois
    }
  }
  // 5) grava no aparelho (persistência local)
  DB.retiradas.push(reg);
  if(occ) DB.ocorrencias.push(occ);
  DB.auditoria.unshift(aud);
  const vv=veiculo(v.id);
  vv.status="Em uso"; vv.km=Math.max(+vv.km||0,+reg.kmInicial); vv.kmEm=agora;
  vv.motoristaAtualId=reg.motoristaId; vv.retiradaAtualId=reg.id;
  save(); wzClear();
  if(offline){
    filaAdd("retiradas",reg); filaAdd("veiculos",vv); extras.forEach(x=>filaAdd(x.aba,x.registro));
    toast("⚠ Sem conexão: a retirada ficou salva no aparelho e será enviada automaticamente");
  }
  showComprovanteRet(reg);
}

/* ============ CÂMERA AO VIVO (todas as fotos) ============
   Em vez do seletor de arquivo (que deixa escolher da galeria e permite foto
   antiga), abrimos a câmera dentro do app. A imagem é capturada ao vivo e
   recebe um carimbo de data/hora "queimado" no pixel — garante que a foto foi
   tirada na hora, no aparelho, e não pode ser uma foto repassada/antiga. */
const PHOTO_CB = {};                 // key -> callback(dataUrl)
let CAM = { stream:null, key:null, facing:"environment" };

/* Registra qual função recebe a foto de cada campo. */
function registrarFoto(key, cb){ PHOTO_CB[key]=cb; }

/* Abre a câmera para um campo. Chamado pelo clique no slot. */
async function triggerPhoto(key){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Este aparelho/navegador não permite câmera ao vivo");
    return;
  }
  CAM.key=key;
  const bg=$("#cam-bg"); bg.classList.add("show");
  $("#cam-hint").textContent="Enquadre e toque no botão para capturar";
  await abrirStream();
}

async function abrirStream(){
  try{
    if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; }
    const constraints={ video:{ facingMode:CAM.facing, width:{ideal:1280}, height:{ideal:960} }, audio:false };
    const stream=await navigator.mediaDevices.getUserMedia(constraints);
    CAM.stream=stream;
    const v=$("#cam-video"); v.srcObject=stream; await v.play().catch(()=>{});
  }catch(err){
    console.error("Câmera:",err);
    let msg="Não consegui abrir a câmera.";
    if(err && (err.name==="NotAllowedError"||err.name==="SecurityError"))
      msg="Permissão de câmera negada. Autorize a câmera nas configurações do navegador e tente de novo.";
    else if(err && err.name==="NotFoundError") msg="Nenhuma câmera encontrada neste aparelho.";
    $("#cam-hint").textContent=msg;
    toast(msg);
  }
}

function fecharCamera(){
  const bg=$("#cam-bg"); bg.classList.remove("show");
  if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; }
  $("#cam-video").srcObject=null;
  CAM.key=null;
}

async function virarCamera(){
  CAM.facing = (CAM.facing==="environment") ? "user" : "environment";
  await abrirStream();
}

/* Captura o quadro atual, aplica o carimbo e devolve pela callback. */
function capturarFoto(){
  const v=$("#cam-video");
  if(!v || !v.videoWidth){ toast("Aguarde a câmera carregar"); return; }
  const key=CAM.key;
  // desenha o quadro no canvas, reduzindo para largura máx. 900 (mais leve p/ subir)
  const maxW=900;
  let w=v.videoWidth, h=v.videoHeight;
  if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
  const c=$("#cam-canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  ctx.drawImage(v,0,0,w,h);
  // ---- carimbo de data/hora ----
  const agora=new Date();
  const carimbo=agora.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const texto="VEGAS FROTA · "+carimbo;
  const fs=Math.max(15, Math.round(w*0.034));   // tamanho da fonte proporcional
  ctx.font="bold "+fs+"px Arial";
  ctx.textBaseline="bottom";
  const padY=Math.round(fs*0.5), barH=fs+padY*2;
  // faixa escura semitransparente no rodapé
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(0, h-barH, w, barH);
  // texto dourado
  ctx.fillStyle="#e9c66a";
  ctx.fillText(texto, Math.round(fs*0.4), h-padY);
  const dataUrl=c.toDataURL("image/jpeg", .62);   // mais compressão = arquivo menor
  // entrega para quem pediu a foto
  const cb=PHOTO_CB[key];
  fecharCamera();
  if(typeof cb==="function"){ cb(dataUrl); toast("Foto capturada ✓"); }
}

/* ============ helpers de foto no wizard ============ */
/* photoSlotHTML recebe a foto guardada em WZ.fotos. Ao tocar, abre a câmera
   ao vivo (triggerPhoto). O <input type=file> foi removido: não há mais opção
   de galeria, então não entra foto antiga. */
function photoSlotHTML(key,label,em,val){
  const has=!!val;
  return `<div class="photo-slot ${has?"done":""}" id="slot-${key}" onclick="triggerPhoto('${key}')">
    ${has?`<img src="${val}"><button class="rm" onclick="event.stopPropagation();removePhoto('${key}')">✕</button><span class="badge">✓ ${esc(label)}</span>`

async function finalizarDevolucao(){
  // 1) estado mais recente: a entrega pode ter sido registrada em outro aparelho
  await atualizarAntes();
  const r=DB.retiradas.find(x=>x.id===WZ.retiradaId), v=veiculo(WZ.veiculoId);
  if(!r||!v){ alert("Retirada não encontrada."); return; }
  if(r.devolvida){ alert("Esta retirada já teve a entrega registrada (em outro aparelho)."); wzClear(); go(SESSION.tipo==="motorista"?"mot-home":"dashboard"); return; }
  const erroKm=validarKm(v.id, WZ.kmFinal, Math.max(+r.kmInicial||0, kmAtual(v.id)));
  if(erroKm){ alert(erroKm); WZ.step=0; wzSave(); renderDevWizard(); return; }

  // 2) fotos
  const did=uid("dev");
  const fotoRefs={};
  let soLocal=0, totalFotos=0;
  const guarda=async(key,dataUrl)=>{ totalFotos++; const ref=await photoPut(key,dataUrl); if(!/^https?:\/\//.test(ref)) soLocal++; return ref; };
  for(const [k] of FOTOS_DEV){if(WZ.fotos[k]){fotoRefs[k]=await guarda(did+"_dev_"+k,WZ.fotos[k]);}}
  const chk={};
  for(const i in WZ.checklist){const c={...WZ.checklist[i]};if(c.foto){c.foto=await guarda(did+"_dev_chk"+i,c.foto);}chk[i]=c;}
  const agora=nowISO(), mot=motorista(r.motoristaId);
  const perc=(+WZ.kmFinal)-(+r.kmInicial||0);
  const dev={id:did,retiradaId:r.id,veiculoId:v.id,placa:v.placa,veiculoInterno:v.interno,
    motoristaId:r.motoristaId,motoristaNome:mot?.nome||r.motoristaNome||"",
    kmInicial:+r.kmInicial||0,kmFinal:+WZ.kmFinal,kmPercorrido:perc,obs:WZ.obs||"",
    checklist:chk,fotos:fotoRefs,ocorrencia:{...WZ.ocorrencia},data:agora,
    registradoPor:SESSION.nome,registradoPorId:SESSION.id,registradoPorTipo:SESSION.tipo,
    termo:{data:agora,usuario:SESSION.nome}};
  const extras=[]; let occ=null;
  if(WZ.ocorrencia.tem){
    const oid=uid("o"); let ofoto=[];
    if(WZ.fotos.occ){ ofoto=[await guarda(oid+"_occ", WZ.fotos.occ)]; }
    occ={id:oid,veiculoId:v.id,motoristaId:r.motoristaId,tipo:WZ.ocorrencia.tipo,
      data:agora,local:r.destinoNome,descricao:WZ.ocorrencia.desc,status:"Aberta",fotos:ofoto};
    extras.push({aba:"ocorrencias",registro:occ});
  }
  if(apiConfigurada() && soLocal>0){ toast("⚠ "+soLocal+" de "+totalFotos+" fotos não subiram à nuvem — ficaram no aparelho"); }
  const aud={id:uid("a"),usuario:SESSION.nome,nivel:SESSION.nivel,data:agora,acao:"Devolveu viatura",
    registro:v.interno+" · "+v.placa+" · "+(mot?.nome||"")+" · KM "+fmtNum(dev.kmFinal)+" (percorrido "+perc+" km)"};
  extras.push({aba:"auditoria",registro:aud});

  // 3) grava no SERVIDOR com trava (recusa entrega em dobro)
  let offline=false;
  if(apiConfigurada()){
    try{
      let res;
      try{ res=await api("devolver",{devolucao:dev,retirada:r,extras}); }
      catch(e2){ if(!backendAntigo(e2)) throw e2;
        const rr=Object.assign({},r,{devolvida:true,devolucaoId:did,devolvidaEm:agora});
        await api("pushMuitos",{itens:[{aba:"devolucoes",registro:dev},{aba:"retiradas",registro:rr},...extras]}); res={}; }
      if(res.veiculo){ const i=DB.veiculos.findIndex(x=>x.id===v.id); if(i>=0){ DB.veiculos[i]=res.veiculo; marcarSync("veiculos",[res.veiculo]); } }
    }catch(e){
      if(!erroDeRede(e)){
        const d=e.dados||{};
        if(d.erro==="JA_DEVOLVIDA"){ await atualizarAntes(); alert("A entrega deste veículo já foi registrada em outro aparelho."); wzClear(); go(SESSION.tipo==="motorista"?"mot-home":"dashboard"); return; }
        if(d.erro==="KM_INVALIDO"){ alert(MSG_KM_INVALIDO); WZ.step=0; wzSave(); renderDevWizard(); return; }
        alert("O servidor recusou a entrega: "+e.message); return;
      }
      offline=true;
    }
  }
  // 4) grava no aparelho — a retirada continua no histórico, só marcada como devolvida
  DB.devolucoes.push(dev);
  r.devolvida=true; r.devolucaoId=did; r.devolvidaEm=agora;
  if(occ) DB.ocorrencias.push(occ);
  DB.auditoria.unshift(aud);
  const vv=veiculo(v.id);
  if((+dev.kmFinal)>(+vv.km||0)){ vv.km=+dev.kmFinal; vv.kmEm=agora; }
  vv.ultimoMotoristaId=r.motoristaId;
  if(!retiradaAberta(vv.id)){ if(vv.status==="Em uso"||!vv.status) vv.status="Disponível"; vv.motoristaAtualId=""; vv.retiradaAtualId=""; }
  if(!offline && apiConfigurada()){
    marcarSync("devolucoes",[dev]); marcarSync("retiradas",[r]); extras.forEach(x=>marcarSync(x.aba,[x.registro]));
    marcarSync("veiculos",[vv]);
  }
  const teveOcorrencia=!!(WZ.ocorrencia && WZ.ocorrencia.tem);
  save(); wzClear();
  if(offline){
    filaAdd("devolucoes",dev); filaAdd("retiradas",r); filaAdd("veiculos",vv); extras.forEach(x=>filaAdd(x.aba,x.registro));
    toast("⚠ Sem conexão: a entrega ficou salva no aparelho e será enviada automaticamente");
  }
  CURRENT="comprovante";
  $("#view").innerHTML=`<div class="wizard-body"><div class="card receipt">
    <div class="big-em">🟢</div><h3>Entrega registrada</h3>
    <div class="rec-lines">
      <div class="rl"><span>Motorista</span><b>${esc(dev.motoristaNome||"—")}</b></div>
      <div class="rl"><span>Veículo</span><b>${esc(v.interno)} · ${esc(v.placa)}</b></div>
      <div class="rl"><span>KM inicial</span><b>${fmtNum(r.kmInicial)}</b></div>
      <div class="rl"><span>KM final</span><b>${fmtNum(dev.kmFinal)}</b></div>
      <div class="rl"><span>Percorrido</span><b>${fmtNum(perc)} km</b></div>
      <div class="rl"><span>Data / hora</span><b>${dtBR(dev.data)}</b></div>
      <div class="rl"><span>Responsável pela entrega</span><b>${esc(dev.registradoPor)}</b></div>
      <div class="rl"><span>Ocorrências</span><b>${teveOcorrencia?"Sim":"Não"}</b></div>
      <div class="rl"><span>Status</span><b style="color:var(--green)">${vStatusTag(statusVeiculo(veiculo(v.id)))}</b></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn sec" onclick="gerarComprovantePDF('dev','${dev.id}')">📄 Comprovante PDF</button>
      <button class="btn" onclick="go('${SESSION.tipo==="motorista"?"mot-home":"dashboard"}')">Concluir</button></div>
  </div></div>`;
}

/* Foto do painel: obrigatória para veículo; NÃO obrigatória para GERADOR. */
function abExigePainel(){
  if((window._abTipo||"veiculo")==="gerador") return false;
  const v=veiculo(($("#ab-veic")||{}).value);
  return !ehGerador(v);
}
function abVeicMudou(){
  const v=veiculo(($("#ab-veic")||{}).value), info=$("#ab-veic-info");
  if(info) info.innerHTML = v ? `KM atual registrado: <b>${fmtKm(kmAtual(v.id))}</b>${statusVeiculo(v)==="Em uso"?" · com "+esc(motorista(retiradaAberta(v.id).motoristaId)?.nome||""):""}`
    +(ehGerador(v)?"":calibAlertaHTML(v.id)) : "";
  const bp=$("#ab-box-painel"); if(bp) bp.style.display=abExigePainel()?"":"none";
}

function setAbastTipo(t){
  const isG = t==="gerador";
  window._abTipo = isG?"gerador":"veiculo";
  const bv=$("#ab-tp-veic"), bg=$("#ab-tp-ger");
  if(bv) bv.classList.toggle("on",!isG);
  if(bg) bg.classList.toggle("on",isG);
  const boxV=$("#ab-box-veic"), boxG=$("#ab-box-ger"), boxT=$("#ab-box-tanque");
  if(boxV) boxV.style.display = isG?"none":"";
  if(boxG) boxG.style.display = isG?"":"none";
  if(boxT) boxT.style.display = isG?"none":"";
  const bp=$("#ab-box-painel"); if(bp) bp.style.display = abExigePainel()?"":"none";
  const sel=$("#ab-comb");
  if(sel){
    const atual=sel.value;
    const opts=isG?COMB_GERADOR:COMB_VEICULO;
    sel.innerHTML=opts.map(o=>`<option ${o===atual?"selected":""}>${o}</option>`).join("");
    if(opts.indexOf(atual)<0) sel.value=opts[0];
  }
  ajustaUnidadeComb();
}

/* GNV é medido em metro cúbico (m³); os demais em litro (L). */
function unidadeComb(comb){ return comb==="GNV" ? "m³" : "L"; }
/* Unidade de um abastecimento já registrado (registros antigos = L). */
function unidadeAbast(a){ return a.unidade || unidadeComb(a.combustivel); }
function ajustaUnidadeComb(){
  const comb=($("#ab-comb")||{}).value||"";
  const u=unidadeComb(comb);
  const lq=$("#ab-lbl-qtd"), lv=$("#ab-lbl-vl");
  if(lq) lq.textContent = u==="m³" ? "Metros cúbicos (m³)" : "Litros";
  if(lv) lv.textContent = "Valor por "+u+" (R$)";
}
function setTanque(v){window._tanque=v;$("#ab-tc-sim").classList.toggle("on",v);$("#ab-tc-nao").classList.toggle("on",!v);}
function calcAbast(){const l=+$("#ab-litros").value||0,vl=+$("#ab-vl").value||0;$("#ab-total").textContent=fmtMoney(l*vl);}

async function saveAbastecimento(){
  const g=k=>{const e=$("#ab-"+k); return e?e.value:"";};
  const tipo=window._abTipo||"veiculo";
  if(tipo==="veiculo" && !g("veic")){toast("Selecione o veículo");return;}
  if(tipo==="gerador" && !g("ger").trim()){toast("Identifique o gerador");return;}
  const litros=+g("litros")||0, vl=+g("vl")||0;
  const unidade=unidadeComb(g("comb"));
  if(!litros){toast("Informe a quantidade ("+unidade+")");return;}
  const vSel=tipo==="veiculo"?veiculo(g("veic")):null;
  const semKm=tipo==="gerador"||ehGerador(vSel);
  if(!semKm){
    if(g("km")===""){ alert("Informe a quilometragem do veículo. Abastecimento sem KM não é permitido."); return; }
    const erro=validarKm(vSel.id, g("km"));
    if(erro){ alert(erro); return; }
  }
  if(abExigePainel() && !window._painel){ alert("Tire a foto do PAINEL do veículo mostrando a quilometragem. Ela é obrigatória no abastecimento."); return; }
  const id=uid("ab"); let cupomRef=null, painelRef=null;
  if(window._painel && abExigePainel()){ painelRef=await photoPut(id+"_painel", window._painel); }
  if(window._cupom){ cupomRef=await photoPut(id+"_cupom", window._cupom); }
  if(apiConfigurada() && painelRef && !/^https?:\/\//.test(painelRef)){ toast("⚠ A foto do painel não subiu à nuvem — ficou no aparelho"); }
  if(apiConfigurada() && window._cupom && cupomRef && !/^https?:\/\//.test(cupomRef)){
    toast("⚠ A foto do cupom não subiu à nuvem — ficou no aparelho");
  }
  const reg={id,tipo,
    veiculoId: tipo==="veiculo"?g("veic"):"",
    gerador:   tipo==="gerador"?g("ger").trim():"",
    local:     tipo==="gerador"?g("local").trim():"",
    motoristaId:g("mot"),
    data:g("data")?new Date(g("data")).toISOString():nowISO(),
    km: tipo==="veiculo"?(+g("km")||0):0,
    posto:g("posto"),combustivel:g("comb"),litros,unidade,valorLitro:vl,total:litros*vl,
    tanqueCheio: tipo==="veiculo"?window._tanque:false,cupom:cupomRef,fotoPainel:painelRef,
    placa: vSel?vSel.placa:"", veiculoInterno: vSel?vSel.interno:"", obs:g("obs").trim(),
    registradoPor:SESSION.nome, registradoPorId:SESSION.id};
  DB.abastecimentos.push(reg);
  let alvo="Gerador "+reg.gerador, abas=["abastecimentos","auditoria"];
  if(tipo==="veiculo" && vSel){
    if(reg.km>(+vSel.km||0)){ vSel.km=reg.km; vSel.kmEm=reg.data; }
    alvo=vSel.interno; abas.push("veiculos");
  }
  log("Registrou abastecimento",alvo+" "+litros+unidade+(reg.km?" · KM "+fmtNum(reg.km):""));
  window._cupom=null;window._painel=null;saveSync(abas);closeModal();toast("Abastecimento registrado");
  go(SESSION.tipo==="motorista"?"mot-abast":"abastecimentos");
}

ROUTES.calibragem=(el)=>{
  const ordem={sem:0,atrasada:1,hoje:2,prox:3,ok:4};
  const arr=DB.veiculos.filter(v=>!ehGerador(v)).map(v=>({v,c:calibStatus(v.id)}))
    .sort((a,b)=>(ordem[a.c.nivel]-ordem[b.c.nivel])||(a.v.interno||"").localeCompare(b.v.interno||"","pt-BR"));
  const cont=n=>arr.filter(x=>n.includes(x.c.nivel)).length;
  el.innerHTML=`<div class="wrap"><h2 class="page-title">🛞 Calibragem dos pneus <small>1 vez por semana, por veículo</small></h2>
    <div class="grid g4" style="margin-bottom:14px">
      ${stat("🔴","Atrasadas / hoje",cont(["sem","atrasada","hoje"]),"red")}
      ${stat("🟡","Próximas",cont(["prox"]),"orange")}
      ${stat("🟢","Em dia",cont(["ok"]),"green")}
    </div>
    <button class="btn" style="margin-bottom:14px" onclick="formCalibragem()">＋ 🛞 Registrar calibragem</button>
    <div class="list">${arr.map(({v,c})=>`<div class="row-item ${c.cor==="red"?"calib-atrasada":""}">
      <div class="av">${v.tipo==="Moto"?"🏍️":esc(v.interno.replace("V-",""))}</div>
      <div class="main" onclick="go('veiculo-det','${v.id}')" style="cursor:pointer"><div class="t">${esc(v.interno)} · ${esc(v.placa)}</div>
        <div class="s">${c.ultima?"Última: "+dBR(c.ultima.data)+" · "+esc(c.ultima.responsavelNome||"—")+" · Próxima: <b>"+dBR(c.proxima)+"</b>":"Nenhuma calibragem registrada"}</div>
        <div class="s">${calibTag(v.id)}</div></div>
      <button class="btn sm" style="width:auto" onclick="formCalibragem('${v.id}')">Registrar</button></div>`).join("")}</div>
  </div>`;
};
function formCalibragem(vid){
  closeModal();
  const vs=DB.veiculos.filter(v=>!ehGerador(v)), ms=DB.motoristas.filter(m=>m.status==="Ativo");
  const motDefault=SESSION.tipo==="motorista"?SESSION.id:"";
  if(!vid && SESSION.tipo==="motorista") vid=DB.retiradas.find(r=>!r.devolvida&&r.motoristaId===SESSION.id)?.veiculoId||"";
  openModal("Registrar calibragem dos pneus",`
    <label>Veículo</label><select id="cb-veic" onchange="cbVeicMudou()"><option value="">Selecione</option>${vs.map(v=>`<option value="${v.id}" ${v.id===vid?"selected":""}>${esc(v.interno)} · ${esc(v.placa)}</option>`).join("")}</select>
    <div id="cb-info" class="hint"></div>
    <div class="two"><div><label>Data e hora</label><input id="cb-data" type="datetime-local" value="${localDT()}"></div>
      <div><label>KM na calibragem</label><input id="cb-km" type="number" inputmode="numeric"></div></div>
    <label>Responsável</label><select id="cb-resp"><option value="">Selecione</option>${ms.map(m=>`<option value="${m.id}" ${m.id===motDefault?"selected":""}>${esc(m.nome)}</option>`).join("")}</select>
    <label>Observações (opcional)</label><textarea id="cb-obs" placeholder="Ex.: pressão 32 psi, estepe conferido"></textarea>
    <div class="hint">A próxima calibragem é calculada automaticamente: <b>data desta calibragem + 7 dias</b>.</div>
    <div class="wizard-nav"><button class="btn sec" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="salvarComBotao(this, saveCalibragem)">Salvar</button></div>`);
  cbVeicMudou();
}
function cbVeicMudou(){
  const v=veiculo(($("#cb-veic")||{}).value), info=$("#cb-info"), km=$("#cb-km");
  if(!info) return;
  if(!v){ info.innerHTML=""; return; }
  const c=calibStatus(v.id);
  info.innerHTML=`KM atual: <b>${fmtKm(kmAtual(v.id))}</b> · ${calibTag(v.id)}${c.ultima?" · última "+dBR(c.ultima.data):""}`;
  if(km && !km.value) km.value=kmAtual(v.id)||"";
}
async function saveCalibragem(){
  const g=k=>{const e=$("#cb-"+k);return e?e.value:"";};
  const v=veiculo(g("veic"));
  if(!v){ toast("Selecione o veículo"); return; }
  if(!g("resp")){ toast("Selecione o responsável"); return; }
  if(g("km")!==""){ const erro=validarKm(v.id,g("km")); if(erro){ alert(erro); return; } }
  const data=g("data")?new Date(g("data")).toISOString():nowISO();
  if(new Date(data)>new Date(Date.now()+5*60000)){ alert("A data da calibragem não pode estar no futuro."); return; }
  const resp=motorista(g("resp"));
  const reg={id:uid("cal"),veiculoId:v.id,placa:v.placa,veiculoInterno:v.interno,data,
    km:+g("km")||0,responsavelId:resp?.id||"",responsavelNome:resp?.nome||"",
    obs:g("obs").trim(),registradoPor:SESSION.nome,registradoPorId:SESSION.id};
  const prox=new Date(data); prox.setHours(0,0,0,0); prox.setDate(prox.getDate()+CALIB_DIAS);
  reg.proxima=prox.toISOString();
  DB.calibragens.push(reg);
  if(reg.km>(+v.km||0)){ v.km=reg.km; v.kmEm=data; }
  log("Registrou calibragem",v.interno+" · próxima "+dBR(prox));
  saveSync(["calibragens","veiculos","auditoria"]);
  closeModal(); toast("Calibragem registrada — próxima em "+dBR(prox));
  if(CURRENT==="veiculo-det") go("veiculo-det",v.id);
  else if(["calibragem","mot-home","veiculos","dashboard"].includes(CURRENT)) go(CURRENT);
}

/* ============ CÁLCULOS DE CUSTO POR VEÍCULO ============ */
function veiculoStats(vid){
  const abast=DB.abastecimentos.filter(a=>a.veiculoId===vid);
  const man=DB.manutencoes.filter(m=>m.veiculoId===vid);
  const devs=DB.devolucoes.filter(d=>d.veiculoId===vid);
  const comb=abast.reduce((s,a)=>s+(+a.total||0),0);
  const manut=man.reduce((s,m)=>s+(+m.valor||0),0);
  const total=comb+manut;
  const km=devs.reduce((s,d)=>s+(+d.kmPercorrido||0),0);
  const litros=abast.reduce((s,a)=>s+(+a.litros||0),0);
  const consumo=(litros>0&&km>0)?km/litros:0;
  const custoKm=km>0?total/km:0;
  return{comb,manut,total,km,litros,consumo,custoKm,nAbast:abast.length};
}

/* ============ ALERTAS ============ */
function computeAlertas(resumo){
  const al=[];
  DB.veiculos.forEach(v=>{
    const n=retiradasAbertas(v.id).length;
    if(n>1) al.push({level:"red",em:"⚠️",t:"Veículo com "+n+" retiradas abertas",s:v.interno+" · "+v.placa+" · registre a entrega de cada uma (Devolver viatura)"});
  });
  if(resumo){
    const cs=DB.veiculos.filter(v=>!ehGerador(v)).map(v=>({v,c:calibStatus(v.id)}));
    const red=cs.filter(x=>x.c.cor==="red"), yel=cs.filter(x=>x.c.nivel==="prox");
    if(red.length) al.push({level:"red",em:"🛞",t:red.length+" veículo(s) com calibragem atrasada ou para hoje",s:red.slice(0,6).map(x=>x.v.interno).join(", ")+(red.length>6?"…":"")+" — veja em Calibragem"});
    if(yel.length) al.push({level:"yellow",em:"🛞",t:yel.length+" calibragem(ns) próxima(s)",s:yel.map(x=>x.v.interno).join(", ")});
  } else DB.veiculos.filter(v=>!ehGerador(v)).forEach(v=>{
    const c=calibStatus(v.id);
    if(c.nivel==="ok") return;
    al.push({level:c.cor==="red"?"red":"yellow",em:"🛞",t:c.rotulo,s:v.interno+" · "+v.placa+(c.proxima?" · prevista "+dBR(c.proxima):" · nunca registrada")});
  });
  DB.motoristas.forEach(m=>{
    if(!m.validadeCnh||m.status!=="Ativo")return;
    const days=Math.ceil((new Date(m.validadeCnh)-new Date())/86400000);
    if(days<0)al.push({level:"red",em:"🔴",t:"CNH vencida",s:m.nome+" · venceu em "+dBR(m.validadeCnh)});
    else if(days<=30)al.push({level:"yellow",em:"🟡",t:"CNH próxima do vencimento",s:m.nome+" · "+days+" dias"});
  });
  DB.manutencoes.forEach(mn=>{
    if(!mn.proximaData)return;
    const days=Math.ceil((new Date(mn.proximaData)-new Date())/86400000);
    const v=veiculo(mn.veiculoId);
    if(days<0)al.push({level:"red",em:"🔴",t:"Manutenção atrasada",s:(v?.interno||"")+" · "+mn.tipo});
    else if(days<=15)al.push({level:"yellow",em:"🟡",t:"Manutenção próxima",s:(v?.interno||"")+" · "+mn.tipo+" em "+days+"d"});
  });
  DB.ocorrencias.filter(o=>o.status!=="Resolvida").forEach(o=>{
    const v=veiculo(o.veiculoId);
    al.push({level:"red",em:"⚠️",t:"Veículo com ocorrência",s:(v?.interno||"")+" · "+o.tipo});
  });
  // consumo acima da média
  const rows=DB.veiculos.map(v=>({v,...veiculoStats(v.id)})).filter(r=>r.consumo>0);
  if(rows.length){const media=rows.reduce((s,r)=>s+r.consumo,0)/rows.length;
    rows.filter(r=>r.consumo<media*0.85).forEach(r=>al.push({level:"yellow",em:"⛽",t:"Consumo acima da média",s:r.v.interno+" · "+r.consumo.toFixed(2)+" km/L"}));}
  return al;
}
ROUTES.alertas=(el)=>{
  const al=computeAlertas();
  el.innerHTML=`<div class="wrap"><h2 class="page-title">🔔 Alertas <small>${al.length}</small></h2>
    <div class="list">${al.length?al.map(a=>`<div class="alert-item ${a.level}"><span class="em">${a.em}</span>
      <div class="txt"><div class="t">${esc(a.t)}</div><div class="s">${esc(a.s)}</div></div></div>`).join("")

function relFiltro(){
  const de=$("#rp-de").value?new Date($("#rp-de").value):null;
  const ate=$("#rp-ate").value?new Date($("#rp-ate").value+"T23:59:59"):null;
  const vid=$("#rp-veic").value, mid=$("#rp-mot").value;
  return{de,ate,vid,mid,test:(iso,v,m)=>{const d=new Date(iso);
    if(de&&d<de)return false; if(ate&&d>ate)return false;
    if(vid&&v!==vid)return false; if(mid&&m!==mid)return false; return true;}};
}
let _relData=null,_relTipo=null;
function gerarRelatorio(tipo){
  const f=relFiltro(); _relTipo=tipo;
  let head=[],rows=[],title="";
  if(tipo==="utilizacao"){
    title="Relatório de Utilização";head=["Data","Veículo","Motorista","Destino","KM ini","KM fim","Percorrido","Status"];
    DB.retiradas.filter(r=>f.test(r.data,r.veiculoId,r.motoristaId)).forEach(r=>{
      const v=veiculo(r.veiculoId),m=motorista(r.motoristaId),dev=DB.devolucoes.find(d=>d.id===r.devolucaoId);
      rows.push([dtBR(r.data),v?.interno||"",m?.nome||"",r.destinoNome,r.kmInicial,dev?.kmFinal||"",dev?.kmPercorrido||"",r.devolvida?"Devolvido":"Em uso"]);});
  } else if(tipo==="abastecimento"){
    title="Relatório de Abastecimento";head=["Data","Tipo","Veículo/Gerador","Responsável","Posto","Combustível","Qtd.","Unid.","R$/un.","Total"];
    DB.abastecimentos.filter(a=>f.test(a.data,a.veiculoId,a.motoristaId)).forEach(a=>{
      const ehGer=a.tipo==="gerador";
      const v=veiculo(a.veiculoId),m=motorista(a.motoristaId);
      const alvo=ehGer?((a.gerador||"")+(a.local?" ("+a.local+")":"")):(v?.interno||"");
      rows.push([dtBR(a.data),ehGer?"Gerador":"Veículo",alvo,m?.nome||"",a.posto,a.combustivel||"",a.litros,unidadeAbast(a),a.valorLitro,a.total]);});
  } else if(tipo==="gastos"){
    title="Relatório de Gastos";head=["Veículo","Combustível","Manutenção","Total","KM","Custo/km"];
    DB.veiculos.filter(v=>!f.vid||v.id===f.vid).forEach(v=>{const s=veiculoStats(v.id);
      rows.push([v.interno,s.comb.toFixed(2),s.manut.toFixed(2),s.total.toFixed(2),s.km,s.custoKm.toFixed(2)]);});
  } else if(tipo==="manutencao"){
    title="Relatório de Manutenção";head=["Data","Veículo","Tipo","Oficina","Valor"];
    DB.manutencoes.filter(m=>f.test(m.data,m.veiculoId,"")).forEach(m=>{const v=veiculo(m.veiculoId);
      rows.push([dBR(m.data),v?.interno||"",m.tipo,m.oficina,m.valor]);});
  } else if(tipo==="ocorrencias"){
    title="Relatório de Ocorrências";head=["Data","Veículo","Motorista","Tipo","Status"];
    DB.ocorrencias.filter(o=>f.test(o.data,o.veiculoId,o.motoristaId)).forEach(o=>{
      const v=veiculo(o.veiculoId),m=motorista(o.motoristaId);
      rows.push([dtBR(o.data),v?.interno||"",m?.nome||"",o.tipo,o.status]);});
  } else if(tipo==="quilometragem"){
    title="Relatório de Quilometragem";head=["Data","Veículo","Motorista","Percorrido"];
    DB.devolucoes.filter(d=>f.test(d.data,d.veiculoId,d.motoristaId)).forEach(d=>{
      const v=veiculo(d.veiculoId),m=motorista(d.motoristaId);
      rows.push([dtBR(d.data),v?.interno||"",m?.nome||"",d.kmPercorrido]);});
  }
  _relData={title,head,rows};
  const out=$("#rp-out");
  out.innerHTML=`<div class="section-title">${esc(title)} <span class="line"></span></div>

}
