<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>VEGAS FROTA NITERÓI — Controle de Frota</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0b0f1a; --bg2:#111827; --card:#161e2e; --card2:#1c2740;
  --line:#243049; --txt:#e8edf6; --muted:#93a1bd; --muted2:#6b7896;
  --gold:#e0b64b; --gold2:#c99a2e; --red:#e5484d; --green:#2fb56a;
  --orange:#e08a2b; --blue:#3b82f6; --purple:#8b5cf6;
  --shadow:0 10px 30px rgba(0,0,0,.45); --r:16px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#182238 0,var(--bg) 55%) fixed,var(--bg);
  color:var(--txt); font-size:15px; line-height:1.45; min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3550;border-radius:8px}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;z-index:100;
  background:radial-gradient(900px 500px at 50% 0,#182238 0,#070a12 70%)}
.login-box{width:100%;max-width:390px;background:linear-gradient(180deg,#141d2e,#0f1626);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px 26px;text-align:center}
.login-box img{width:180px;margin:6px auto 4px;display:block}
.login-sub{color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
.tab-row{display:flex;background:#0c1220;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;gap:4px}
.tab-row button{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:9px;font-weight:600;font-size:13px}
.tab-row button.active{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1405}

/* ---------- FORM ---------- */
label{display:block;text-align:left;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:600;letter-spacing:.02em}
input,select,textarea{width:100%;background:#0c1220;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:13px 13px;font-size:15px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:80px;resize:vertical}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%2393a1bd' viewBox='0 0 16 16'><path d='M8 11L3 6h10z'/></svg>");background-repeat:no-repeat;background-position:right 13px center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:14px 18px;font-weight:700;font-size:15px;width:100%;color:#1a1405;
  background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 6px 18px rgba(224,182,75,.25)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1b2440;color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(180deg,#f0575c,#d23a3f);color:#fff;box-shadow:0 6px 18px rgba(229,72,77,.25)}
.btn.green{background:linear-gradient(180deg,#37c477,#25955a);color:#052012;box-shadow:none}
.btn.sm{padding:9px 13px;font-size:13px;width:auto}
.btn.blue{background:linear-gradient(180deg,#4b8ef8,#2f6fd6);color:#fff;box-shadow:none}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;padding-bottom:78px}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(10,14,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar img{height:30px}
.topbar .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.25}
.topbar .who b{color:var(--gold);font-size:13px}
.topbar .who span{color:var(--muted2);text-transform:capitalize}
.icon-btn{background:#1b2440;border:1px solid var(--line);color:var(--txt);border-radius:10px;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;font-size:17px}

.wrap{max-width:1200px;margin:0 auto;padding:16px}
h2.page-title{font-size:19px;margin:2px 0 14px;display:flex;align-items:center;gap:9px}
.page-title small{font-weight:400;color:var(--muted);font-size:13px}

/* ---------- CARDS / GRID ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat{position:relative;overflow:hidden}
.stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.stat .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.stat .val small{font-size:14px;color:var(--muted);font-weight:600}
.stat .ic{position:absolute;right:12px;top:12px;font-size:22px;opacity:.9}
.stat.green .val{color:var(--green)} .stat.red .val{color:var(--red)}
.stat.orange .val{color:var(--orange)} .stat.gold .val{color:var(--gold)}
.stat.blue .val{color:var(--blue)}

.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;color:var(--txt);display:flex;align-items:center;gap:8px}
.section-title .line{flex:1;height:1px;background:var(--line)}

/* ---------- LIST / TABLE ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.row-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.row-item .av{width:42px;height:42px;border-radius:11px;background:#22304d;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:15px;flex-shrink:0;overflow:hidden}
.row-item .av img{width:100%;height:100%;object-fit:cover}
.row-item .main{flex:1;min-width:0}
.row-item .main .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .main .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.row-item .act{display:flex;gap:6px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.tag.green{background:rgba(47,181,106,.15);color:#5fd898}
.tag.red{background:rgba(229,72,77,.15);color:#ff7a7e}
.tag.orange{background:rgba(224,138,43,.15);color:#f0a94e}
.tag.gray{background:rgba(148,161,189,.12);color:var(--muted)}
.tag.blue{background:rgba(59,130,246,.15);color:#7aa8f7}
.tag.gold{background:rgba(224,182,75,.15);color:var(--gold)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #1a2338}
tr:last-child td{border-bottom:0}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:45;display:flex;background:rgba(10,14,24,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:transparent;border:0;color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10.5px;font-weight:600;border-radius:10px}
.bottomnav button .bi{font-size:20px;line-height:1}
.bottomnav button.active{color:var(--gold)}
.bottomnav button.active .bi{transform:translateY(-1px)}

/* ---------- BIG ACTION ---------- */
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.big-btn{border:0;border-radius:18px;padding:22px 16px;color:#fff;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow)}
.big-btn .em{font-size:32px}
.big-btn.take{background:linear-gradient(150deg,#37c477,#1f8a54)}
.big-btn.ret{background:linear-gradient(150deg,#4b8ef8,#2a5fc0)}
.big-btn.fuel{background:linear-gradient(150deg,#e0a13a,#c07d1e);color:#1a1405}
.big-btn.occ{background:linear-gradient(150deg,#e5484d,#b83236)}
.big-btn.calib{background:linear-gradient(150deg,#2bb3a8,#1b7d75);grid-column:1/-1}
/* veículo com calibragem atrasada: destaque na lista */
.row-item.calib-atrasada,.opt.calib-atrasada{border-color:rgba(229,72,77,.55)!important;box-shadow:inset 3px 0 0 var(--red)}
.calib-alert .btn{flex-shrink:0}

/* ---------- WIZARD ---------- */
.wizard-head{position:sticky;top:56px;z-index:30;background:rgba(11,15,26,.96);backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid var(--line)}
.wizard-head .step-lbl{font-size:12.5px;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between}
.wizard-head .step-lbl b{color:var(--gold)}
.progress{height:8px;background:#0c1220;border-radius:6px;overflow:hidden}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s;border-radius:6px}
.wizard-body{padding:16px;max-width:640px;margin:0 auto}
.wizard-body h3{font-size:18px;margin:0 0 4px}
.wizard-body .desc{color:var(--muted);font-size:13px;margin-bottom:16px}
.wizard-nav{display:flex;gap:10px;margin-top:22px}
.wizard-nav .btn{flex:1}

/* pick cards */
.pick{display:grid;gap:10px}
.pick .opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:14px;transition:.12s}
.pick .opt.sel{border-color:var(--gold);background:#1e2740;box-shadow:0 0 0 3px rgba(224,182,75,.12)}
.pick .opt .av{width:44px;height:44px;border-radius:11px;background:#22304d;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);flex-shrink:0}
.pick .opt .info{flex:1;min-width:0}
.pick .opt .info .t{font-weight:700}
.pick .opt .info .s{font-size:12.5px;color:var(--muted)}
.pick .opt .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.pick .opt.sel .chk{border-color:var(--gold);background:var(--gold);position:relative}
.pick .opt.sel .chk:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#1a1405;font-size:13px;font-weight:900}

/* checklist */
.chk-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.chk-item .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chk-item .top .nm{font-weight:600;font-size:14px}
.seg{display:flex;gap:5px}
.seg button{border:1px solid var(--line);background:#0c1220;color:var(--muted);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}
.seg button.ok.on{background:var(--green);color:#052012;border-color:var(--green)}
.seg button.pb.on{background:var(--red);color:#fff;border-color:var(--red)}
.seg button.na.on{background:#3a4560;color:#fff;border-color:#3a4560}
.chk-extra{margin-top:10px;display:none}
.chk-extra.show{display:block}

/* photos */
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photo-slot{border:1.5px dashed var(--line);border-radius:13px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);background:#0c1220;position:relative;overflow:hidden;font-size:12.5px;text-align:center;padding:8px}
.photo-slot .em{font-size:26px}
.photo-slot.done{border-style:solid;border-color:var(--green)}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-slot .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;width:26px;height:26px;font-size:14px;z-index:2}
.photo-slot .badge{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 8px;border-radius:8px;z-index:2}

/* fuel gauge */
.fuel-row{display:flex;gap:7px;margin-top:4px}
.fuel-row button{flex:1;border:1px solid var(--line);background:#0c1220;color:var(--muted);padding:11px 4px;border-radius:10px;font-weight:700;font-size:12px}
.fuel-row button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}

/* level pills */
.pill-row{display:flex;gap:7px;flex-wrap:wrap}
.pill-row button{border:1px solid var(--line);background:#0c1220;color:var(--muted);padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px}
.pill-row button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* term */
.term-box{background:#0c1220;border:1px solid var(--line);border-radius:13px;padding:16px;font-size:13.5px;color:#cfd8ea;line-height:1.6}
.check-line{display:flex;align-items:flex-start;gap:11px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.check-line .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;margin-top:1px}
.check-line.on .box{background:var(--green);border-color:var(--green);position:relative}
.check-line.on .box:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#052012;font-weight:900}

/* receipt */
.receipt{text-align:center;padding:10px}
.receipt .big-em{font-size:56px}
.receipt h3{font-size:20px;margin:6px 0 4px;color:var(--green)}
.rec-lines{text-align:left;background:#0c1220;border:1px solid var(--line);border-radius:13px;padding:14px;margin:16px 0}
.rec-lines .rl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #1c2740;font-size:13.5px}
.rec-lines .rl:last-child{border-bottom:0}
.rec-lines .rl span:first-child{color:var(--muted)}
.rec-lines .rl b{font-weight:700}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,7,14,.75);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal .mh h3{margin:0;font-size:17px}
.modal .mh .x{background:#1b2440;border:1px solid var(--line);color:var(--txt);border-radius:10px;width:34px;height:34px;font-size:16px}
@media(min-width:720px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:20px}}

/* map */
#fleet-map{height:60vh;min-height:340px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.leaflet-popup-content{font-size:13px}
.map-note{font-size:12px;color:var(--muted2);margin-top:10px;display:flex;gap:7px;align-items:flex-start}

/* alerts */
.alert-item{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px}
.alert-item.red{border-left-color:var(--red)}
.alert-item.yellow{border-left-color:var(--gold)}
.alert-item .em{font-size:20px}
.alert-item .txt{flex:1}
.alert-item .txt .t{font-weight:600;font-size:13.5px}
.alert-item .txt .s{font-size:12px;color:var(--muted)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:16px}
.tl-item:before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.tl-item .tl-date{font-size:12px;color:var(--muted);font-weight:600}
.tl-item .tl-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:5px}

/* compare */
.cmp-row{margin-bottom:16px}
.cmp-row .cmp-t{font-weight:700;font-size:13px;margin-bottom:7px;color:var(--gold)}
.cmp-imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-imgs figure{margin:0}
.cmp-imgs figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.cmp-imgs img{width:100%;border-radius:10px;border:1px solid var(--line);aspect-ratio:4/3;object-fit:cover;background:#0c1220}

/* misc */
.empty{text-align:center;color:var(--muted2);padding:38px 16px}
.empty .em{font-size:40px;opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600}
.chips button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.hint{font-size:12px;color:var(--muted2);margin-top:5px}
.divider{height:1px;background:var(--line);margin:16px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-bar{height:9px;background:#0c1220;border-radius:6px;overflow:hidden;margin-top:6px}
.mini-bar > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1b2440;border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:12px;z-index:300;box-shadow:var(--shadow);font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media(max-width:640px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .stat .val{font-size:22px}
}
@media(max-width:400px){.big-actions{grid-template-columns:1fr}}

/* Barra de status da nuvem (tela de login) */
.nuvem-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding:10px 12px;background:#121826;border:1px solid #2a3550;border-radius:12px;font-size:.82rem;color:#9fb0c8}
.nuvem-bar .icon-btn{background:#1c2740;border:1px solid #2a3550;color:#e0b64b;width:34px;height:34px;border-radius:9px;font-size:1rem;cursor:pointer;flex:0 0 auto}
.nuvem-bar .icon-btn:hover{background:#243254}
.row-item .s{font-size:.78rem;color:#8ea0ba;margin-top:2px}
.btn.ghost{background:transparent;border:1px solid #2a3550;color:#cdd8ea}
.btn.ghost:hover{background:#1c2740}
.row{display:flex}
.senha-wrap{position:relative}
.senha-wrap input{width:100%;padding-right:44px}
.senha-olho{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;opacity:.6;padding:4px}
.senha-olho:hover{opacity:1}

/* ===== Câmera ao vivo ===== */
.cam-bg{position:fixed;inset:0;background:#000;z-index:400;display:none;flex-direction:column}
.cam-bg.show{display:flex}
.cam-video{flex:1;width:100%;object-fit:cover;background:#000}
.cam-canvas{display:none}
.cam-bar{padding:16px;display:flex;align-items:center;justify-content:center;gap:24px;background:#0a0f1a;position:relative}
.cam-shot{width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid #c9a24b;cursor:pointer;flex-shrink:0}
.cam-shot:active{transform:scale(.92)}
.cam-x{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#fff;font-size:26px;background:none;border:none;cursor:pointer;padding:8px}
.cam-flip{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#fff;font-size:24px;background:none;border:none;cursor:pointer;padding:8px}
.cam-hint{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}

/* Chamada genérica ao backend. Usa text/plain p/ evitar preflight CORS. */
async function api(acao, payload){
  if(!API_URL) throw new Error("API não configurada");
  const body = Object.assign({acao}, payload||{});
  // timeout: fotos podem ser grandes, então damos mais tempo a elas.
  const limite = acao==="foto" ? 30000 : 15000;
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), limite);
  let resp;
  try{
    resp = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(t);
    throw new Error(e.name==="AbortError" ? "Tempo esgotado na conexão" : "Falha de conexão");
  }
  clearTimeout(t);
  const txt = await resp.text();
  let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error("Resposta inválida do servidor"); }
  if(!j.ok && j.erro){ const er=new Error(j.erro); er.dados=j; throw er; }
  return j;
}
/* true quando o erro foi de rede (sem internet / tempo esgotado), e não uma

/* Todas as tabelas do banco (a ordem não importa). */
const TABELAS=["usuarios","motoristas","veiculos","destinos","retiradas","devolucoes",
  "abastecimentos","manutencoes","ocorrencias","calibragens","auditoria"];
const TABELAS_SEED=()=>({usuarios:SEED_USUARIOS,motoristas:SEED_MOTORISTAS,veiculos:SEED_VEICULOS,destinos:SEED_DESTINOS});
let ULTIMO_PULL=0;

/* Baixa o banco da planilha e JUNTA com o que está no aparelho.
   CORREÇÃO: antes, só as tabelas de movimento eram protegidas; qualquer
   alteração local ainda não confirmada em VEÍCULOS (status e KM) era
   substituída pela versão velha da planilha — por isso a quilometragem
   "sumia" e veículos retirados voltavam a aparecer como disponíveis.
   Agora nenhum registro local pendente é descartado, em nenhuma tabela. */
let PULL_PROMISE=null;
function nuvemPull(){
  if(PULL_PROMISE) return PULL_PROMISE;          // evita dois pulls ao mesmo tempo
  PULL_PROMISE=(async()=>{
    try{ await filaSincronizar(); }catch(e){}
    const hashes=syncHashes();
    const pend={};
    TABELAS.forEach(aba=>{
      pend[aba]=(DB[aba]||[]).filter(r=>r && r.id!=null && hashes[aba]?.[r.id]!==hashReg(r));
    });
    const j=await api("pull");
    if(!j.db) return DB;
    const remoto=j.db, seeds=TABELAS_SEED();
    const novo={}, novosHash={}, reenviar=new Set();
    TABELAS.forEach(aba=>{
      const rem=Array.isArray(remoto[aba])?remoto[aba].filter(r=>r&&r.id!=null):[];
      novosHash[aba]={};
      rem.forEach(r=>{ novosHash[aba][r.id]=hashReg(r); });
      let arr=rem.slice();
      // planilha vazia nas tabelas de cadastro: mantém o que o aparelho tem (ou os dados iniciais)
      if(!arr.length && seeds[aba]){ arr=((DB[aba]&&DB[aba].length)?DB[aba]:seeds[aba]).slice(); }
      const idx=new Map(arr.map((r,i)=>[String(r.id),i]));
      (pend[aba]||[]).forEach(loc=>{
        const i=idx.get(String(loc.id));
        if(i==null){ arr.push(loc); idx.set(String(loc.id),arr.length-1); reenviar.add(aba); return; }
        const r=arr[i];
        if(aba==="retiradas"){
          // retirada fechada em qualquer lugar continua fechada
          if(r.devolvida && !loc.devolvida) return;
          arr[i]=Object.assign({},r,loc,{devolvida:!!(r.devolvida||loc.devolvida),
            devolucaoId:loc.devolucaoId||r.devolucaoId, devolvidaEm:loc.devolvidaEm||r.devolvidaEm});
        } else if(aba==="veiculos"){
          const m=Object.assign({},r,loc);
          const correcaoLocal=loc.kmCorrigidoEm && loc.kmCorrigidoEm!==r.kmCorrigidoEm;
          if(!correcaoLocal && (+r.km||0)>(+loc.km||0)){ m.km=r.km; m.kmEm=r.kmEm; }
          arr[i]=m;
        } else {
          arr[i]=loc;                       // edição local ainda não enviada vence
        }
        reenviar.add(aba);
      });
      novo[aba]=arr;
    });
    novo._seq=Math.max(remoto._seq||100, DB._seq||100);
    // auditoria: no aparelho ficam só os 1500 registros mais recentes (a planilha guarda tudo)
    novo.auditoria.sort((a,b)=>String(b.data||"").localeCompare(String(a.data||"")));
    if(novo.auditoria.length>1500) novo.auditoria=novo.auditoria.slice(0,1500);
    DB=normalizarDB(novo);
    localStorage.setItem(SYNC_HASH_KEY, JSON.stringify(novosHash));
    save();
    ULTIMO_PULL=Date.now();
    reenviar.forEach(aba=>{ Promise.resolve(nuvemPushTabela(aba)).catch(()=>{}); });
    if(!(remoto.motoristas||[]).length){ await nuvemSemear(); }
    return DB;
  })();
  PULL_PROMISE.finally(()=>{ PULL_PROMISE=null; }).catch(()=>{});
  return PULL_PROMISE;
}
/* Atualiza da nuvem antes de uma ação crítica. Se não houver internet,
   segue com os dados do aparelho (e avisa). Retorna true se atualizou. */
async function atualizarAntes(msg){
  if(!apiConfigurada()) return false;
  try{ if(msg) toast(msg); await nuvemPull(); return true; }
  catch(e){ console.warn("Sem atualizar da nuvem:",e.message); toast("⚠ Sem conexão — usando os dados deste aparelho"); return false; }
}

/* Envia seeds iniciais para a planilha (primeira instalação). */
async function nuvemSemear(){
  const itens=[];
  DB.usuarios.forEach(r=>itens.push({aba:"usuarios",registro:r}));
  DB.motoristas.forEach(r=>itens.push({aba:"motoristas",registro:r}));
  DB.veiculos.forEach(r=>itens.push({aba:"veiculos",registro:r}));
  DB.destinos.forEach(r=>itens.push({aba:"destinos",registro:r}));
  // envia em lotes para não estourar tamanho
  for(let i=0;i<itens.length;i+=40){
    await api("pushMuitos",{itens:itens.slice(i,i+40)});
  }
  await api("setSeq",{v:DB._seq});
}

/* Empurra UM registro de uma tabela para a nuvem (fire-and-forget seguro). */
async function nuvemPush(aba, registro){
  if(!API_URL) return;            // modo offline puro
  try{
    await api("push",{aba, registro});
    await api("setSeq",{v:DB._seq});
  }catch(e){
    // guarda na fila para reenviar depois
    filaAdd(aba, registro);
    console.warn("Falha ao sincronizar, salvo na fila:", e.message);
  }
}

/* Fila de reenvio (quando estiver offline). */
const FILA_KEY="vegasnit_fila_sync";
function filaAdd(aba,registro){
  const f=JSON.parse(localStorage.getItem(FILA_KEY)||"[]");
  f.push({aba,registro,ts:Date.now()});
  localStorage.setItem(FILA_KEY,JSON.stringify(f));
}
let FILA_RODANDO=false;
async function filaSincronizar(){
  if(!API_URL || FILA_RODANDO) return;
  let f=JSON.parse(localStorage.getItem(FILA_KEY)||"[]");
  if(!f.length) return;
  FILA_RODANDO=true;
  // mantém só a versão mais recente de cada registro
  const mapa=new Map();
  f.forEach(it=>{ if(it && it.registro) mapa.set(it.aba+"|"+it.registro.id, it); });
  const restantes=[];
  try{
    for(const item of mapa.values()){
      try{ await api("push",{aba:item.aba,registro:limparRegistro(item.registro)}); marcarSync(item.aba,[item.registro]); }
      catch(e){ restantes.push(item); }
    }
  } finally { FILA_RODANDO=false; }
  // o que entrou na fila enquanto enviávamos também é preservado
  const novosNaFila=JSON.parse(localStorage.getItem(FILA_KEY)||"[]").slice(f.length);
  localStorage.setItem(FILA_KEY,JSON.stringify(restantes.concat(novosNaFila)));
  if(f.length && !restantes.length) toast("Dados pendentes sincronizados ✓");
}

/* Sobe uma foto (base64) para o Drive e retorna a URL pública.
   Substitui o antigo photoPut quando a API está configurada. */
async function nuvemFoto(nome, dataUrl){
  if(!API_URL) return null;
  // tenta até 3x: o Apps Script às vezes recusa chamadas em sequência rápida
  let ultimoErro=null;
  for(let tentativa=1; tentativa<=3; tentativa++){
    try{
      const j=await api("foto",{nome, dataUrl});
      if(j && j.url) return j.url;
    }catch(e){ ultimoErro=e; }
    await new Promise(r=>setTimeout(r, 400*tentativa));   // espera crescente antes de tentar de novo
  }
  if(ultimoErro) console.warn("nuvemFoto falhou após 3 tentativas:", ultimoErro.message);
  return null;
}

/* Sincroniza tabelas de movimento inteiras (usado após operações em lote). */
/* ---- Controle do que já está confirmado na planilha ----
   Guarda um "hash" de cada registro já gravado. Assim cada salvamento envia
   SÓ o que mudou (antes reenviava a tabela inteira a cada ação, o que ficava
   lento, estourava o tempo e falhava em silêncio). */
const SYNC_HASH_KEY="vegasnit_sync_hash";
function syncHashes(){ try{ return JSON.parse(localStorage.getItem(SYNC_HASH_KEY)||"{}"); }catch(e){ return {}; } }
function hashReg(r){
  const t=JSON.stringify(r); let h=0;
  for(let i=0;i<t.length;i++){ h=((h<<5)-h+t.charCodeAt(i))|0; }
  return h+":"+t.length;
}
function marcarSync(aba,regs){
  const hs=syncHashes(); hs[aba]=hs[aba]||{};
  regs.forEach(r=>{ if(r && r.id!=null) hs[aba][r.id]=hashReg(r); });
  localStorage.setItem(SYNC_HASH_KEY, JSON.stringify(hs));
}
/* Remove fotos em base64 de dentro dos registros. A foto já foi salva no
   Drive/aparelho e o registro guarda só a referência. Base64 dentro do
   registro passava do limite de 50.000 caracteres por célula da planilha
   e a retirada inteira era recusada. */
function limparRegistro(r){
  if(r && r.avaria && Array.isArray(r.avaria.fotos) && r.avaria.fotos.length){ delete r.avaria.fotos; }
  return r;
}
const PUSH_EM_ANDAMENTO={};
async function nuvemPushTabela(aba){
  if(!API_URL) return;
  if(PUSH_EM_ANDAMENTO[aba]){ PUSH_EM_ANDAMENTO[aba].depois=true; return; }
  PUSH_EM_ANDAMENTO[aba]={depois:false};
  try{
    const hs=syncHashes()[aba]||{};
    const dados=(DB[aba]||[]).map(limparRegistro).filter(r=>r && r.id!=null && hs[r.id]!==hashReg(r));
    for(let i=0;i<dados.length;i+=20){
      const lote=dados.slice(i,i+20);
      try{
        await api("pushMuitos",{itens:lote.map(r=>({aba,registro:r}))});
        marcarSync(aba,lote);
      }catch(e){
        console.warn("push tabela falhou",aba,e.message);
        lote.forEach(r=>filaAdd(aba,r));   // não perde: tenta de novo depois
      }
    }
  } finally {
    const again=PUSH_EM_ANDAMENTO[aba].depois;
    delete PUSH_EM_ANDAMENTO[aba];
    if(again) nuvemPushTabela(aba);
  }
}

/* ============================================================
   VEGAS FROTA — Sistema de Controle de Frota
   Armazenamento: localStorage (dados) + IndexedDB (fotos)
   ============================================================ */

/* ---------- DB (localStorage) ---------- */
const DB_KEY = "vegasnit_db_v1";
let DB = load();

/* Garante que todas as tabelas existem (bancos antigos não tinham
   "calibragens", por exemplo) e que nada vem como null. */
function normalizarDB(db){
  db=db||{};
  TABELAS.forEach(t=>{ if(!Array.isArray(db[t])) db[t]=[]; });
  const seeds=TABELAS_SEED();
  Object.keys(seeds).forEach(t=>{ if(!db[t].length) db[t]=seeds[t].slice(); });
  db._seq=+db._seq||100;
  return db;
}
function load(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ return normalizarDB(JSON.parse(raw)); }catch(e){ console.error("Banco local corrompido:",e); } }
  const fresh = {
    usuarios: SEED_USUARIOS,
    motoristas: SEED_MOTORISTAS,
    veiculos: SEED_VEICULOS,
    destinos: SEED_DESTINOS,
    retiradas: [],      // registros de saída (com checklist/fotos-refs)
    devolucoes: [],     // registros de devolução
    abastecimentos: [],
    manutencoes: [],
    ocorrencias: [],
    calibragens: [],
    auditoria: [],
    _seq: 100
  };
  localStorage.setItem(DB_KEY, JSON.stringify(fresh));
  return fresh;
}
/* CORREÇÃO: o save() antigo não tratava "armazenamento cheio". Quando o
   localStorage lotava (fotos + auditoria), a gravação falhava em silêncio:
   o registro existia só na memória e sumia ao atualizar a página. */
function save(){
  const txt=JSON.stringify(DB);
  try{ localStorage.setItem(DB_KEY, txt); return true; }
  catch(e){
    console.warn("Armazenamento cheio, liberando espaço:",e);
    try{
      if(DB.auditoria.length>300) DB.auditoria=DB.auditoria.slice(0,300);
      localStorage.setItem(DB_KEY, JSON.stringify(DB)); return true;
    }catch(e2){
      alert("ATENÇÃO: o armazenamento deste aparelho está cheio e o registro pode não ter sido salvo aqui.\n"+
            (apiConfigurada()?"Ele foi enviado para a nuvem — atualize a página com internet.":"Conecte a nuvem ou libere espaço no navegador."));
      return false;
    }
  }
}
/* Salva local e empurra as tabelas alteradas para a nuvem (se configurada).
   Uso: saveSync(["retiradas","veiculos"]).  Sem argumento = só salva local. */
function saveSync(abas){
  save();
  if(typeof nuvemPushTabela==="function" && apiConfigurada() && abas && abas.length){
    abas.forEach(a=>{ Promise.resolve(nuvemPushTabela(a)).catch(e=>console.warn("sync "+a+":",e.message)); });
    if(typeof api==="function"){ Promise.resolve(api("setSeq",{v:DB._seq})).catch(()=>{}); }
  }
}
/* ID único: sequência + hora + aleatório. Dois celulares não geram o mesmo ID. */
function uid(pfx){ DB._seq++; return (pfx||"id")+DB._seq+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- IndexedDB para fotos (base64) ---------- */
let IDB=null;
function idbOpen(){
  return new Promise((res)=>{
    try{
      if(typeof indexedDB==="undefined"){ IDB=null; return res(null); }
      const r = indexedDB.open("vegasfrota_photos",1);
      r.onupgradeneeded = e=>{ try{ e.target.result.createObjectStore("fotos"); }catch(err){} };
      r.onsuccess = e=>{ IDB=e.target.result; res(IDB); };
      r.onerror = ()=>{ console.warn("IndexedDB indisponível — fotos irão para o armazenamento comum"); IDB=null; res(null); };
      r.onblocked = ()=>{ IDB=null; res(null); };
    }catch(e){ console.warn("IndexedDB bloqueado:",e); IDB=null; res(null); }
  });
}
/* Grava foto: se a API do Google estiver configurada, sobe pro Drive e
   retorna a URL pública (que é guardada como "referência"). Caso contrário,
   grava no IndexedDB local usando a "key" informada. */
async function photoPut(key,dataUrl){
  if(typeof apiConfigurada==="function" && apiConfigurada()){
    try{
      const url=await nuvemFoto(key,dataUrl);
      if(url) return url;            // referência = URL do Drive
    }catch(e){ console.warn("Foto Drive falhou, salvando local:",e.message); }
  }
  // Plano A: IndexedDB (aguenta muitos MB). Plano B: localStorage (se IDB falhar).
  return new Promise((res)=>{
    if(!IDB){
      try{ localStorage.setItem("foto_"+key, dataUrl); }catch(e){ console.warn("localStorage foto:",e); }
      return res(key);
    }
    try{
      const tx=IDB.transaction("fotos","readwrite");
      tx.objectStore("fotos").put(dataUrl,key);
      tx.oncomplete=()=>res(key);
      tx.onerror=()=>{ try{ localStorage.setItem("foto_"+key, dataUrl); }catch(e){} res(key); };
    }catch(e){
      try{ localStorage.setItem("foto_"+key, dataUrl); }catch(err){}
      res(key);
    }
  });
}
/* Lê foto: se a referência for uma URL (http), devolve direto; senão busca no IndexedDB (ou localStorage). */
/* Converte links antigos/variados do Google Drive para um formato que
   carrega direto em <img> (lh3.googleusercontent.com). O formato antigo
   uc?export=view foi descontinuado e passou a mostrar página de aviso. */
function normalizaDriveUrl(u){
  if(!u || typeof u!=="string") return u;
  // já está no formato lh3 -> ok
  if(/lh3\.googleusercontent\.com\/d\//.test(u)) return u;
  // tenta extrair o ID do arquivo dos formatos conhecidos
  let m = u.match(/[?&]id=([\w-]{20,})/)              // uc?export=view&id=ID
       || u.match(/\/file\/d\/([\w-]{20,})/)           // /file/d/ID/view
       || u.match(/\/d\/([\w-]{20,})/);                // /d/ID
  if(m && m[1]) return "https://lh3.googleusercontent.com/d/"+m[1];
  return u;
}
function photoGet(key){
  return new Promise((res)=>{
    if(!key){res(null);return;}
    if(/^https?:\/\//.test(key)){ res(normalizaDriveUrl(key)); return; }   // já é URL (Drive) — normaliza
    if(!IDB){ res(localStorage.getItem("foto_"+key)||null); return; }
    try{
      const tx=IDB.transaction("fotos","readonly");
      const rq=tx.objectStore("fotos").get(key);
      rq.onsuccess=()=>res(rq.result || localStorage.getItem("foto_"+key) || null);
      rq.onerror=()=>res(localStorage.getItem("foto_"+key)||null);
    }catch(e){ res(localStorage.getItem("foto_"+key)||null); }
  });
}

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const fmtMoney=n=>"R$ "+(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum=n=>(Number(n)||0).toLocaleString("pt-BR");

/* Executa uma ação de salvar mostrando "Salvando..." e BLOQUEANDO o botão
   enquanto processa — evita o clique duplo que gravava o registro 2x. */
async function salvarComBotao(btn, acao){
  if(!btn){ return acao(); }               // sem botão: roda direto
  if(btn.dataset.saving==="1") return;      // já está salvando: ignora clique duplo
  btn.dataset.saving="1";
  const txtOriginal=btn.innerHTML;
  btn.disabled=true;
  btn.style.opacity=".7";
  btn.innerHTML="⏳ Salvando...";
  toast("Salvando...");
  const restaurar=()=>{ btn.dataset.saving=""; btn.disabled=false; btn.style.opacity=""; btn.innerHTML=txtOriginal; };
  try{
    await acao();
    // Se a ação barrou numa validação (ex.: "Selecione o veículo") a tela não
    // troca e o botão continua na página — nesse caso reabilitamos para a
    // pessoa corrigir e tentar de novo. Se salvou, a tela troca e o botão some.
    if(document.body.contains(btn)) restaurar();
  }catch(err){
    console.error("Erro ao salvar:",err);
    toast("Não consegui salvar. Tente de novo.");
    restaurar();
  }
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initials(nome){return (nome||"?").split(/[\s,e]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();}

/* compressão de imagem via canvas */
function compressImage(file,maxW=1280,quality=.72){
  return new Promise((res)=>{
    const img=new Image(); const rd=new FileReader();
    rd.onload=()=>{img.src=rd.result;};
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",quality));
    };
    rd.readAsDataURL(file);
  });
}

/* Processa um anexo: se for imagem, comprime; se for PDF, lê inteiro.
   Retorna {dataUrl, tipo:"img"|"pdf", nomeArq}. */
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(rd.result);
    rd.onerror=rej;
    rd.readAsDataURL(file);
  });
}
async function processarAnexo(file){
  if(!file) return null;
  const ehPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name||"");
  if(ehPdf){
    // limite de segurança ~8MB para não estourar armazenamento
    if(file.size>8*1024*1024){ toast("PDF muito grande (máx. 8MB)"); return null; }
    const dataUrl=await fileToDataURL(file);
    return {dataUrl, tipo:"pdf", nomeArq:file.name||"documento.pdf"};
  }
  const dataUrl=await compressImage(file);
  return {dataUrl, tipo:"img", nomeArq:file.name||"foto.jpg"};
}

let SESSION=null;
const SES_KEY="vegasnit_session";

function toggleSenha(){
  const inp=$("#adm-senha"), btn=$("#toggle-senha");

function initLogin(){
  const s=sessionStorage.getItem(SES_KEY);
  if(s){ try{SESSION=JSON.parse(s); enterApp(); return;}catch(e){} }
  // tabs
  $$(".tab-row button").forEach(b=>b.onclick=()=>{
    $$(".tab-row button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    const mot=b.dataset.tab==="motorista";
    $("#login-admin").style.display=mot?"none":"block";
    $("#login-mot").style.display=mot?"block":"none";
    $("#login-err").textContent="";
  });
  // admin login
  $("#btn-login-admin").onclick=async()=>{
    const l=$("#adm-login").value.trim(), s=$("#adm-senha").value;
    const btn=$("#btn-login-admin");
    // se a nuvem está configurada, sincroniza antes de validar
    if(typeof apiConfigurada==="function" && apiConfigurada()){
      btn.disabled=true; btn.textContent="Sincronizando...";
      try{ await nuvemPull(); }catch(e){ console.warn("Pull falhou:",e.message); }
      btn.disabled=false; btn.textContent="Entrar";
    }
    const u=DB.usuarios.find(u=>u.login===l&&u.senha===s);
    if(!u){ $("#login-err").textContent="Login ou senha inválidos."; return; }
    SESSION={id:u.id,nome:u.nome,nivel:u.nivel,tipo:"admin"};
    sessionStorage.setItem(SES_KEY,JSON.stringify(SESSION));
    log("Login no sistema","");
    enterApp();
  };
  // motorista login (select)
  preencherMotoristas();
  $("#btn-login-mot").onclick=async()=>{
    const id=$("#mot-select").value;
    if(!id){ $("#login-err").textContent="Selecione seu nome."; return; }
    const btn=$("#btn-login-mot");
    if(typeof apiConfigurada==="function" && apiConfigurada()){
      btn.disabled=true; btn.textContent="Sincronizando...";
      try{ await nuvemPull(); }catch(e){ console.warn("Pull falhou:",e.message); }
      btn.disabled=false; btn.textContent="Entrar";
      // repopula o select e restaura a seleção caso a lista tenha mudado
      preencherMotoristas();
      $("#mot-select").value=id;
    }
    const m=DB.motoristas.find(x=>x.id===id);
    if(!m){ $("#login-err").textContent="Selecione seu nome."; return; }
    SESSION={id:m.id,nome:m.nome,nivel:"Motorista",tipo:"motorista"};
    sessionStorage.setItem(SES_KEY,JSON.stringify(SESSION));
    enterApp();
  };
}

/* Sobe para a nuvem as fotos que ficaram salvas SÓ neste aparelho (chaves
   locais), e troca a referência no registro pelo link do Drive. Deve ser
   rodado no aparelho que fez as retiradas. */
async function reenviarFotosLocais(){
  if(!apiConfigurada()){ toast("Conecte a nuvem primeiro"); return; }
  if(!confirm("Isto vai subir para a nuvem as fotos que estão só neste aparelho. Pode levar alguns minutos. Continuar?")) return;
  toast("Procurando fotos locais...");
  let enviadas=0, faltando=0, total=0;
  // coleta todas as referências de foto que são chave local (não http)
  const ehLocal=(v)=> typeof v==="string" && v && !/^https?:\/\//.test(v) && !/^data:/.test(v);
  async function subir(chave){
    total++;
    const dataUrl=await photoGetRaw(chave);      // lê do IndexedDB/local
    if(!dataUrl){ faltando++; return chave; }     // não achou aqui → mantém
    try{
      const r=await api("foto",{nome:chave, dataUrl});
      if(r && r.url){ enviadas++; return r.url; } // troca pela URL do Drive
    }catch(e){ console.warn("reenvio falhou",chave,e.message); }
    faltando++; return chave;
  }
  // retiradas
  for(const r of DB.retiradas){
    if(r.fotos) for(const k in r.fotos){ if(ehLocal(r.fotos[k])) r.fotos[k]=await subir(r.fotos[k]); }
    if(r.checklist) for(const i in r.checklist){ const c=r.checklist[i]; if(c && ehLocal(c.foto)) c.foto=await subir(c.foto); }
  }
  // devoluções
  for(const d of DB.devolucoes){
    if(d.fotos) for(const k in d.fotos){ if(ehLocal(d.fotos[k])) d.fotos[k]=await subir(d.fotos[k]); }
    if(d.checklist) for(const i in d.checklist){ const c=d.checklist[i]; if(c && ehLocal(c.foto)) c.foto=await subir(c.foto); }
  }
  // abastecimentos (cupom)
  for(const a of DB.abastecimentos){ if(ehLocal(a.cupom)) a.cupom=await subir(a.cupom); if(ehLocal(a.fotoPainel)) a.fotoPainel=await subir(a.fotoPainel); }
  for(const m of DB.manutencoes){ if(ehLocal(m.foto)) m.foto=await subir(m.foto); }
  // ocorrências (lista de fotos)
  for(const o of DB.ocorrencias){ if(Array.isArray(o.fotos)) for(let i=0;i<o.fotos.length;i++){ if(ehLocal(o.fotos[i])) o.fotos[i]=await subir(o.fotos[i]); } }

  saveSync(["retiradas","devolucoes","abastecimentos","manutencoes","ocorrencias"]);
  alert("Reenvio concluído.\nFotos enviadas: "+enviadas+"\nNão encontradas neste aparelho: "+faltando+"\nTotal verificado: "+total+
        (faltando?"\n\nAs não encontradas foram tiradas em outro aparelho. Rode esta opção também naquele aparelho.":""));
}
/* Lê o conteúdo bruto de uma foto local (dataURL) sem normalizar. */
function photoGetRaw(key){
  return new Promise((res)=>{
    if(!key || /^https?:\/\//.test(key)){ res(null); return; }
    if(/^data:/.test(key)){ res(key); return; }
    if(!IDB){ res(localStorage.getItem("foto_"+key)||null); return; }
    try{
      const tx=IDB.transaction("fotos","readonly");
      const rq=tx.objectStore("fotos").get(key);
      rq.onsuccess=()=>res(rq.result || localStorage.getItem("foto_"+key) || null);
      rq.onerror=()=>res(localStorage.getItem("foto_"+key)||null);
    }catch(e){ res(localStorage.getItem("foto_"+key)||null); }
  });
}

/* ================================================================
   ESTADO DO VEÍCULO — calculado a partir do histórico (fonte da verdade)
   O veículo é a entidade principal: status, motorista atual e KM atual
   são deduzidos das retiradas/devoluções/abastecimentos vinculados ao ID
   dele. Assim, mesmo que o campo "status" gravado fique desatualizado
   (outro aparelho, internet caindo), o sistema mostra o estado correto.
   ================================================================ */
function retiradasAbertas(vid){
  return DB.retiradas.filter(r=>r.veiculoId===vid && !r.devolvida)
    .sort((a,b)=>new Date(b.data)-new Date(a.data));
}
function retiradaAberta(vid){ return retiradasAbertas(vid)[0]; }
const STATUS_MANUAIS=["Manutenção","Indisponível","Reservado"];
/* Em uso = existe retirada aberta. Senão vale o status manual
   (Manutenção/Indisponível/Reservado). Senão, Disponível. */
function statusVeiculo(v){
  if(!v) return "Indisponível";
  if(retiradaAberta(v.id)) return "Em uso";
  if(STATUS_MANUAIS.includes(v.status)) return v.status;
  return "Disponível";
}
function veiculoDisponivel(v){ return statusVeiculo(v)==="Disponível"; }
/* Todas as leituras de KM de um veículo, em ordem cronológica. */
function kmLeituras(vid){
  const out=[];
  const nomeM=(id,nome)=>nome||motorista(id)?.nome||"—";
  DB.retiradas.filter(r=>r.veiculoId===vid).forEach(r=>out.push({data:r.data,evento:"Retirada",km:+r.kmInicial||0,motorista:nomeM(r.motoristaId,r.motoristaNome),ref:r.id}));
  DB.devolucoes.filter(d=>d.veiculoId===vid).forEach(d=>out.push({data:d.data,evento:d.automatica?"Entrega (automática)":"Entrega",km:+d.kmFinal||0,motorista:nomeM(d.motoristaId,d.motoristaNome),ref:d.id}));
  DB.abastecimentos.filter(a=>a.veiculoId===vid && a.tipo!=="gerador" && +a.km>0).forEach(a=>out.push({data:a.data,evento:"Abastecimento",km:+a.km,motorista:nomeM(a.motoristaId),ref:a.id}));
  DB.manutencoes.filter(m=>m.veiculoId===vid && +m.km>0).forEach(m=>out.push({data:m.data,evento:"Manutenção — "+(m.tipo||""),km:+m.km,motorista:"—",ref:m.id}));
  (DB.calibragens||[]).filter(c=>c.veiculoId===vid && +c.km>0).forEach(c=>out.push({data:c.data,evento:"Calibragem",km:+c.km,motorista:c.responsavelNome||"—",ref:c.id}));
  return out.sort((a,b)=>new Date(a.data)-new Date(b.data));
}
/* KM ATUAL = maior leitura registrada. Se o gestor corrigiu o KM
   manualmente (kmCorrigidoEm), contam só as leituras depois da correção. */
function kmAtual(vid){
  const v=veiculo(vid); if(!v) return 0;
  const corte=v.kmCorrigidoEm?new Date(v.kmCorrigidoEm).getTime():0;
  let km=+v.km||0;
  kmLeituras(vid).forEach(l=>{ if(corte && new Date(l.data).getTime()<=corte) return; if(l.km>km) km=l.km; });
  return km;
}
const MSG_KM_INVALIDO="Quilometragem inválida. O valor informado não pode ser menor que a última quilometragem registrada.";
/* Valida um KM informado para o veículo. Retorna "" se ok, ou a mensagem. */
function validarKm(vid,valor,minimoExtra){
  if(valor===""||valor==null||isNaN(+valor)) return "Informe a quilometragem.";
  const n=+valor;
  if(n<0) return MSG_KM_INVALIDO;
  const minimo=Math.max(kmAtual(vid), +minimoExtra||0);
  if(n<minimo) return MSG_KM_INVALIDO+"\n\nÚltima registrada: "+fmtKm(minimo);
  return "";
}
/* Grava no registro do veículo o estado deduzido (mantém a planilha coerente). */
function atualizarVeiculoDerivado(v,extra){
  if(!v) return v;
  const ab=retiradaAberta(v.id);
  const km=kmAtual(v.id);
  if(km>(+v.km||0)){ v.km=km; v.kmEm=nowISO(); }
  if(ab){ v.status="Em uso"; v.motoristaAtualId=ab.motoristaId; v.retiradaAtualId=ab.id; }
  else { if(v.status==="Em uso"||!v.status) v.status="Disponível"; v.motoristaAtualId=""; v.retiradaAtualId=""; }
  if(extra) Object.assign(v,extra);
  return v;
}
function ultimoMotorista(vid){
  const d=DB.devolucoes.filter(x=>x.veiculoId===vid).sort((a,b)=>new Date(b.data)-new Date(a.data))[0];
  if(!d) return null;
  return d.motoristaNome||motorista(d.motoristaId)?.nome||null;
}
function ehGerador(v){
  if(!v) return false;
  return /gerador/i.test([v.tipo,v.interno,v.placa,v.modelo,v.marca].join(" "));
}

/* ================= CALIBRAGEM DOS PNEUS =================
   Uma vez por semana, por VEÍCULO (não por motorista).
   Próxima = última + 7 dias. */
const CALIB_DIAS=7, CALIB_AVISO_DIAS=2;
function ultimaCalibragem(vid){
  return (DB.calibragens||[]).filter(c=>c.veiculoId===vid).sort((a,b)=>new Date(b.data)-new Date(a.data))[0]||null;
}
function inicioDia(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function proximaCalibragem(c){ if(!c) return null; const d=inicioDia(c.data); d.setDate(d.getDate()+CALIB_DIAS); return d; }
/* nivel: ok | prox | hoje | atrasada | sem */
function calibStatus(vid){
  const c=ultimaCalibragem(vid);
  if(!c) return {nivel:"sem",cor:"red",em:"🔴",rotulo:"SEM CALIBRAGEM",ultima:null,proxima:null,dias:null,
    msg:"CALIBRAGEM ATRASADA — nenhuma calibragem registrada. Realizar antes de utilizar o veículo."};
  const prox=proximaCalibragem(c);
  const dias=Math.round((prox-inicioDia(new Date()))/86400000);
  const base={ultima:c,proxima:prox,dias};
  if(dias<0) return {...base,nivel:"atrasada",cor:"red",em:"🔴",rotulo:"CALIBRAGEM ATRASADA",msg:"CALIBRAGEM ATRASADA — realizar antes de utilizar o veículo."};
  if(dias===0) return {...base,nivel:"hoje",cor:"red",em:"🔴",rotulo:"CALIBRAR HOJE",msg:"Calibragem dos pneus deve ser realizada hoje."};
  if(dias<=CALIB_AVISO_DIAS) return {...base,nivel:"prox",cor:"orange",em:"🟡",rotulo:"PRÓXIMA CALIBRAGEM",msg:"Atenção: a calibragem dos pneus deste veículo está próxima."};
  return {...base,nivel:"ok",cor:"green",em:"🟢",rotulo:"EM DIA",msg:"Calibragem em dia."};
}
function calibAtrasada(vid){ const n=calibStatus(vid).nivel; return n==="atrasada"||n==="sem"; }
function calibTag(vid){ const c=calibStatus(vid); return `<span class="tag ${c.cor}">${c.em} ${c.rotulo}</span>`; }
/* Faixa de alerta grande (motorista vê ao acessar o veículo). */
function calibAlertaHTML(vid){
  const c=calibStatus(vid); if(c.nivel==="ok") return "";
  return `<div class="alert-item ${c.cor==="red"?"red":"yellow"} calib-alert" style="margin:10px 0">
    <span class="em">🛞</span><div class="txt"><div class="t">${c.em} ${esc(c.msg)}</div>
    <div class="s">${c.ultima?"Última: "+dBR(c.ultima.data)+" · Próxima: "+dBR(c.proxima):"Nenhuma calibragem registrada para este veículo"}</div></div>
    <button class="btn sm" style="width:auto;white-space:nowrap" onclick="formCalibragem('${vid}')">Registrar</button></div>`;
}
/* Data/hora local para inputs datetime-local.
   CORREÇÃO: toISOString() dá o horário de Greenwich (3h a mais no Brasil),
   então abastecimentos e ocorrências eram gravados com hora errada. */
function localDT(d){ d=d||new Date(); const z=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes()); }
function localD(d){ return localDT(d).slice(0,10); }
/* "2026-09-25" (input date) -> ISO ao meio-dia local (evita cair no dia anterior). */
function dataInputISO(v){ return v ? new Date(v+"T12:00:00").toISOString() : nowISO(); }

/* Conserta inconsistências: veículos presos em "Em uso" e retiradas antigas
   sem devolução (que faziam o veículo aparecer em uso para sempre).
   Regra: se um veículo tem devolução MAIS RECENTE que a retirada aberta,
   aquela retirada é órfã e deve ser fechada. */
function corrigirStatusFrota(){
  if(!confirm("Corrigir o status da frota?\n\nFecha apenas retiradas que já têm devolução registrada e recalcula status e KM de cada veículo pelo histórico. Nenhum histórico é apagado.")) return;
  let corrigidos=0;
  DB.retiradas.filter(r=>!r.devolvida).forEach(r=>{
    const dev=DB.devolucoes.find(d=>d.retiradaId===r.id);
    if(dev){ r.devolvida=true; r.devolucaoId=r.devolucaoId||dev.id; r.devolvidaEm=r.devolvidaEm||dev.data; corrigidos++; }
  });
  DB.veiculos.forEach(v=>{
    const antes=v.status+"|"+v.km;
    atualizarVeiculoDerivado(v);
    if(antes!==v.status+"|"+v.km) corrigidos++;
  });
  if(corrigidos) log("Corrigiu status da frota",corrigidos+" ajuste(s)");
  saveSync(["retiradas","veiculos","auditoria"]);
  toast(corrigidos? ("Frota corrigida: "+corrigidos+" ajuste(s)") : "Nada a corrigir — tudo certo");
  go("dashboard");
}

/* mês atual filtro */
function isThisMonth(iso){ if(!iso)return false; const d=new Date(iso),n=new Date(); return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}

function saveVeiculo(id){
  const g=k=>$("#vf-"+k).value;
  const data={interno:g("interno").trim(),placa:g("placa").toUpperCase().trim(),marca:g("marca"),modelo:g("modelo"),ano:g("ano"),cor:g("cor"),tipo:g("tipo"),combustivel:g("combustivel"),tanque:+g("tanque")||0,renavam:g("renavam"),chassi:g("chassi"),aquisicao:g("aquisicao"),status:g("status"),obs:g("obs")};
  if(!data.placa){toast("Informe a placa");return;}
  const dup=DB.veiculos.find(x=>x.id!==id && String(x.placa).toUpperCase()===data.placa);
  if(dup){ alert("Já existe um veículo com a placa "+data.placa+" ("+dup.interno+"). Cada veículo precisa ter placa única."); return; }
  const kmInf=+g("km")||0;
  if(id){
    const v=veiculo(id), atual=kmAtual(id);
    if(kmInf<atual){
      if(SESSION.tipo==="motorista"){ alert(MSG_KM_INVALIDO); return; }
      if(!confirm("O KM informado ("+fmtNum(kmInf)+") é MENOR que o último registrado ("+fmtNum(atual)+").\n\nIsso só deve ser feito para corrigir erro de digitação. Confirmar a correção?")) return;
      data.km=kmInf; data.kmCorrigidoEm=nowISO(); data.kmEm=data.kmCorrigidoEm;
      log("Corrigiu KM do veículo",v.interno+": "+fmtNum(atual)+" → "+fmtNum(kmInf));
    } else if(kmInf>atual){ data.km=kmInf; data.kmEm=nowISO(); }
    if(retiradaAberta(id)) data.status="Em uso";
    Object.assign(v,data); log("Editou veículo",v.interno);
  }
  else { DB.veiculos.push({id:uid("v"),foto:null,...data,km:kmInf,kmEm:nowISO()}); log("Cadastrou veículo",data.interno); }
  saveSync(["veiculos","auditoria"]); closeModal(); toast("Veículo salvo"); go("veiculos");
}

function renderTimeline(box,vid){

  const por=x=>x.registradoPor?` · registrado por ${esc(x.registradoPor)}`:"";
  const ob=x=>x.obs?`<br>📝 ${esc(x.obs)}`:"";
  DB.retiradas.filter(r=>r.veiculoId===vid).forEach(r=>ev.push({d:r.data,em:"🚗",t:"Retirada"+(r.devolvida?"":" — EM USO"),s:`👨‍✈️ ${nm(r.motoristaId,r.motoristaNome)} · KM ${fmtNum(r.kmInicial)} · ${esc(r.destinoNome)}${por(r)}${ob(r)}`, fotoBtn:`ret:${r.id}`}));
  DB.devolucoes.filter(x=>x.veiculoId===vid).forEach(x=>ev.push({d:x.data,em:"🔄",t:x.automatica?"Entrega automática":"Entrega",s:`👨‍✈️ ${nm(x.motoristaId,x.motoristaNome)} · KM ${fmtNum(x.kmFinal)} · percorrido ${fmtNum(x.kmPercorrido)} km${x.automatica?" · gerada automaticamente (versão antiga)":""}${por(x)}${ob(x)}`, fotoBtn:`dev:${x.id}`}));
  DB.abastecimentos.filter(a=>a.veiculoId===vid).forEach(a=>ev.push({d:a.data,em:"⛽",t:"Abastecimento",s:`${nm(a.motoristaId)} · ${a.km?"KM "+fmtNum(a.km)+" · ":""}${a.litros} ${unidadeAbast(a)} · ${fmtMoney(a.total)}${a.posto?" · "+esc(a.posto):""}${a.fotoPainel?" · 📷 foto do painel":""}${ob(a)}`, fotoBtn: (a.cupom||a.fotoPainel)?`ab:${a.id}`:null}));
  DB.manutencoes.filter(m=>m.veiculoId===vid).forEach(m=>ev.push({d:m.data,em:"🔧",t:"Manutenção — "+esc(m.tipo),s:`${esc(m.descricao||"")}${m.km?" · KM "+fmtNum(m.km):""} · ${fmtMoney(m.valor)}`}));
  (DB.calibragens||[]).filter(c=>c.veiculoId===vid).forEach(c=>ev.push({d:c.data,em:"🛞",t:"Calibragem dos pneus",s:`${esc(c.responsavelNome||"—")}${c.km?" · KM "+fmtNum(c.km):""} · próxima ${dBR(proximaCalibragem(c))}${por(c)}${ob(c)}`}));
  DB.ocorrencias.filter(o=>o.veiculoId===vid).forEach(o=>ev.push({d:o.data,em:"⚠️",t:"Ocorrência — "+esc(o.tipo),s:esc(o.descricao||"")}));
  ev.sort((a,b)=>new Date(b.d)-new Date(a.d));
  box.innerHTML = ev.length? `<div class="tl">`+ev.map(e=>
    `<div class="tl-item"><div class="tl-date">${dtBR(e.d)}</div>

}

/* Abre um modal mostrando as fotos de uma retirada, devolução ou cupom.
   ref no formato "ret:ID", "dev:ID" ou "ab:ID". */
async function verFotosMov(ref){
  const [tipo,id]=ref.split(":");
  let titulo="Fotos", pares=[];   // pares: [rótulo, chaveDaFoto]
  if(tipo==="ret"){
    const r=DB.retiradas.find(x=>x.id===id); if(!r){toast("Registro não encontrado");return;}
    titulo="Fotos da retirada";
    FOTOS_ITENS.forEach(([k,l])=>{ if(r.fotos?.[k]) pares.push([l, r.fotos[k]]); });
    // fotos de avaria (novo formato: array em avaria.fotosRefs; formato antigo: fotos.avaria)
    if(r.avaria?.fotosRefs?.length) r.avaria.fotosRefs.forEach((ref,i)=>pares.push(["Avaria "+(i+1), ref]));
    else if(r.fotos?.avaria) pares.push(["Avaria", r.fotos.avaria]);
  } else if(tipo==="dev"){
    const d=DB.devolucoes.find(x=>x.id===id); if(!d){toast("Registro não encontrado");return;}
    titulo="Fotos da devolução";
    FOTOS_ITENS.forEach(([k,l])=>{ if(d.fotos?.[k]) pares.push([l, d.fotos[k]]); });
  } else if(tipo==="ab"){
    const a=DB.abastecimentos.find(x=>x.id===id); if(!a){toast("Registro não encontrado");return;}
    titulo="Fotos do abastecimento";
    if(a.fotoPainel) pares.push(["Painel / quilometragem", a.fotoPainel]);
    if(a.cupom) pares.push(["Cupom fiscal", a.cupom]);
  }
  openModal(titulo, `<div id="fotos-mov"><div class="empty">Carregando fotos...</div></div>`);
  if(!pares.length){ $("#fotos-mov").innerHTML='<div class="empty">Sem fotos neste registro</div>'; return; }
  let html="";
  for(const [label,chave] of pares){
    const url=await photoGet(chave);
    const ehUrl = typeof chave==="string" && /^https?:\/\//.test(chave);
    const motivo = ehUrl
      ? "Foto no Drive não carregou (verifique se a pasta está compartilhada como 'qualquer pessoa com o link')"
      : "Foto salva apenas no aparelho que fez o registro (nuvem não estava ativa na hora)";
    html+=`<div style="margin-bottom:14px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">${esc(label)}</div>
      ${url?`<img src="${url}" style="width:100%;border-radius:12px;display:block" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
             <div style="display:none;aspect-ratio:4/3;background:#0c1220;border-radius:10px;border:1px solid var(--line);align-items:center;justify-content:center;color:var(--muted2);font-size:12px;text-align:center;padding:14px">${esc(motivo)}</div>`
           :`<div style="aspect-ratio:4/3;background:#0c1220;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:12px;text-align:center;padding:14px">${esc(motivo)}</div>`}
    </div>`;
  }
  const box=$("#fotos-mov"); if(box) box.innerHTML=html;
}

/* Lista oficial de motoristas (individuais, ordem alfabética). */
const MOTORISTAS_OFICIAIS = ["Antonio Carlos","Vitor Augusto","Nathan Rocha","Ramon da Costa","Carlos Eduardo","Samuel de Mota","Ronald Aragão","Jhonatan Pessanha","Ronaldo Pereira","Juan de Paula","Wagner da Silva","Osias dos Santos","Danniel Xavier","Daniel Felix"];

/* Substitui a lista de motoristas pelos nomes oficiais (separa as duplas).
   Preserva o histórico: motoristas antigos que já têm retiradas continuam
   existindo, mas ficam INATIVOS (somem da seleção); os que não têm histórico
   são removidos. Se um nome oficial já existir, é reaproveitado. */
async function redefinirMotoristas(){
  if(!confirm("Isso vai deixar a lista de motoristas exatamente com os "+MOTORISTAS_OFICIAIS.length+" nomes individuais (separando as duplas).\n\nMotoristas antigos com histórico serão mantidos como inativos (não somem do passado). Continuar?")) return;

  const usados = new Set([
    ...DB.retiradas.map(r=>r.motoristaId),
    ...DB.devolucoes.map(d=>d.motoristaId),
    ...DB.abastecimentos.map(a=>a.motoristaId),
    ...DB.ocorrencias.map(o=>o.motoristaId)
  ].filter(Boolean));

  const norm = s => (s||"").trim().toLowerCase();
  const oficiaisNorm = MOTORISTAS_OFICIAIS.map(norm);

  // 1) marca antigos: se está na lista oficial, reaproveita; senão, inativa (se tem histórico) ou remove
  const manter = [];
  DB.motoristas.forEach(m=>{
    const ehOficial = oficiaisNorm.includes(norm(m.nome));
    if(ehOficial){
      m.status="Ativo";
      manter.push(m);
    } else if(usados.has(m.id)){
      m.status="Inativo";           // tem histórico: mantém inativo
      manter.push(m);
    }
    // sem histórico e fora da lista: descarta (não entra em 'manter')
  });

  // 2) cria os oficiais que ainda não existem
  const jaExistemNorm = manter.filter(m=>m.status==="Ativo").map(m=>norm(m.nome));
  MOTORISTAS_OFICIAIS.forEach(nome=>{
    if(!jaExistemNorm.includes(norm(nome))){
      manter.push({id:uid("m"), foto:null, nome, cpf:"", matricula:"", telefone:"", funcao:"Motorista", cnh:"", cat:"", validadeCnh:"", status:"Ativo", obs:""});
    }
  });

  DB.motoristas = manter;
  log("Redefiniu lista de motoristas", MOTORISTAS_OFICIAIS.length+" oficiais");
  save();  // salva local primeiro
  // Corrige o BANCO CENTRAL de uma vez: apaga as duplas antigas da planilha e
  // regrava só a lista correta. Assim TODOS os aparelhos passam a ver certo,
  // sem precisar corrigir em cada celular.
  if(apiConfigurada()){
    try{
      toast("Corrigindo na nuvem central...");
      await api("substituirTabela", {aba:"motoristas", registros: DB.motoristas});
      await api("setSeq",{v:DB._seq});
      toast("Lista corrigida na nuvem ✓ (vale para todos os aparelhos)");
    }catch(e){
      console.warn("substituirTabela falhou:",e);
      toast("Corrigido neste aparelho, mas falhou na nuvem. Tente de novo com internet.");
    }
  } else {
    toast("Lista de motoristas corrigida ✓");
  }
  go("motoristas");
}

function saveDestino(id){

  if(id){Object.assign(destino(id),data);}else{DB.destinos.push({id:uid("d"),...data});}

}

/* ============================================================
   WIZARD DE RETIRADA (10 etapas)
   ============================================================ */
const RET_STEPS=["Motorista","Viatura","Destino","KM inicial","Checklist","Água/Óleo","Fotos","Avarias","Termo","Confirmar"];

async function startRetirada(){
  // busca o estado mais recente da frota antes de mostrar os veículos
  await atualizarAntes("Atualizando frota...");
  WZ={mode:"retirada",step:0,obs:"",
    motoristaId:SESSION.tipo==="motorista"?SESSION.id:"",
    veiculoId:"",destinoId:"",destinoNome:"",finalidade:"",kmInicial:"",
    nivelComb:"",checklist:{},niveisAgua:"",niveisOleo:"",
    fotos:{},avaria:{tem:false,desc:"",areas:[],fotos:[]},termo:false,
    lat:null,lng:null};
  wzSave(); renderWizard();
}

function renderWizard(){
  CURRENT="wizard";
  const el=$("#view"); const s=WZ.step;
  const prog=Math.round(((s+1)/RET_STEPS.length)*100);
  el.innerHTML=`
    <div class="wizard-head">
      <div class="step-lbl"><span>ETAPA ${s+1} DE ${RET_STEPS.length}</span><b>${RET_STEPS[s]}</b></div>
      <div class="progress"><div class="bar" style="width:${prog}%"></div></div>
    </div>
    <div class="wizard-body" id="wz-body"></div>`;
  const body=$("#wz-body");
  const steps=[stMotorista,stVeiculo,stDestino,stKm,stChecklist,stNiveis,stFotos,stAvarias,stTermo,stConfirmar];
  steps[s](body);
}
function wzNav(back=true,nextLbl="Continuar",nextFn="wzNext()"){
  return `<div class="wizard-nav">
    ${back?`<button class="btn sec" onclick="wzBack()">‹ Voltar</button>`:`<button class="btn sec" onclick="cancelWizard()">Cancelar</button>`}
    <button class="btn" onclick="${nextFn}">${nextLbl}</button></div>`;
}
function wzBack(){ wzCaptureStep(); if(WZ.step>0){WZ.step--;wzSave();renderWizard();} else cancelWizard(); }
function wzNext(){
  wzCaptureStep();
  const nome=RET_STEPS[WZ.step];
  if(nome==="Viatura"){
    if(!WZ.veiculoId){ toast("Selecione a viatura"); return; }
    const v=veiculo(WZ.veiculoId), ab=retiradaAberta(WZ.veiculoId);
    if(ab){ alert(msgEmUso(v,ab)); WZ.veiculoId=""; wzSave(); renderWizard(); return; }
  }
  if(nome==="KM inicial"){
    const erro=validarKm(WZ.veiculoId, WZ.kmInicial);
    if(erro){ alert(erro); return; }
  }
  WZ.step++;wzSave();renderWizard();
}
function msgEmUso(v,ab){
  const m=motorista(ab.motoristaId);
  return (v?v.interno+" · "+v.placa:"Veículo")+" JÁ ESTÁ RETIRADO.\n\nMotorista: "+(m?.nome||ab.motoristaNome||"—")+
    "\nDesde: "+dtBR(ab.data)+"\nKM na retirada: "+fmtNum(ab.kmInicial)+
    "\n\nPara usar este veículo, primeiro registre a ENTREGA dele.";
}
/* Lê os campos de texto/número da etapa atual e grava no WZ.
   (os campos de seleção/foto já gravam sozinhos ao serem tocados) */
function wzCaptureStep(){
  const km=$("#wz-km"); if(km) WZ.kmInicial=km.value.trim();
  const fin=$("#wz-finalidade"); if(fin) WZ.finalidade=fin.value.trim();
  const obs=$("#wz-obs"); if(obs) WZ.obs=obs.value.trim();
  const dest=$("#wz-destoutro");
  if(dest && WZ.destinoId==="_outro") WZ.destinoNome=dest.value.trim();
  // descrições de checklist com problema
  CHECKLIST_ITENS && CHECKLIST_ITENS.forEach((it,i)=>{
    const dsc=$("#chk-desc-"+i);
    if(dsc){ WZ.checklist[i]=WZ.checklist[i]||{}; WZ.checklist[i].desc=dsc.value; }
  });
  // avaria (descrição)
  const av=$("#wz-avaria-desc"); if(av){ WZ.avaria=WZ.avaria||{}; WZ.avaria.desc=av.value.trim(); }
  wzSave();
}
function cancelWizard(){ if(confirm("Cancelar retirada? O progresso será perdido.")){wzClear();go("mot-home");} }

/* etapa 1 - motorista */
function stMotorista(b){
  const list=DB.motoristas.filter(m=>m.status==="Ativo").sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));
  b.innerHTML=`<h3>Quem vai retirar?</h3><p class="desc">Selecione o motorista responsável.</p>
    <div class="pick">${list.map(m=>`<div class="opt ${WZ.motoristaId===m.id?"sel":""}" onclick="pickMot('${m.id}')">
      <div class="av">${initials(m.nome)}</div><div class="info"><div class="t">${esc(m.nome)}</div><div class="s">${esc(m.matricula)}</div></div><div class="chk"></div></div>`).join("")}</div>
    ${wzNav(false)}`;
}
function pickMot(id){ WZ.motoristaId=id;wzSave();stMotorista($("#wz-body")); }

/* etapa 2 - veículo
   CORREÇÃO: antes, veículos retirados podiam ser escolhidos de novo e o
   sistema gerava uma "devolução automática", apagando o vínculo com o
   motorista que estava com ele. Agora veículo em uso NÃO pode ser escolhido. */
function stVeiculo(b){
  const ord=(a,b2)=>(a.interno||"").localeCompare(b2.interno||"","pt-BR");
  const livres=DB.veiculos.filter(v=>veiculoDisponivel(v)&&!ehGerador(v)).sort(ord);
  const bloq=DB.veiculos.filter(v=>(statusVeiculo(v)==="Manutenção"||statusVeiculo(v)==="Indisponível"||statusVeiculo(v)==="Reservado")&&!ehGerador(v)).sort(ord);
  const emUso=DB.veiculos.filter(v=>statusVeiculo(v)==="Em uso").sort(ord);
  const optLivre=v=>{
    const atr=calibAtrasada(v.id), cs=calibStatus(v.id);
    return `<div class="opt ${WZ.veiculoId===v.id?"sel":""} ${atr?"calib-atrasada":""}" onclick="pickVeic('${v.id}')">
      <div class="av">${v.tipo==="Moto"?"🏍️":esc(v.interno.replace("V-",""))}</div>
      <div class="info"><div class="t">${esc(v.interno)} · ${esc(v.placa)}${statusVeiculo(v)!=="Disponível"?" · "+esc(statusVeiculo(v)):""}</div>
      <div class="s">${esc([v.marca,v.modelo].filter(Boolean).join(" ")||v.tipo)} · ${fmtKm(kmAtual(v.id))}</div>
      ${cs.nivel!=="ok"?`<div class="s" style="color:${cs.cor==="red"?"var(--red)":"var(--gold)"};font-weight:700">🛞 ${esc(cs.rotulo)}</div>`:""}</div><div class="chk"></div></div>`;
  };
  const sel=WZ.veiculoId?veiculo(WZ.veiculoId):null;
  b.innerHTML=`<h3>Qual viatura?</h3><p class="desc">Somente viaturas <b>disponíveis</b> podem ser retiradas.</p>
    ${sel?calibAlertaHTML(sel.id):""}
    <div class="section-title" style="margin-top:6px">🟢 Disponíveis (${livres.length}) <span class="line"></span></div>
    ${livres.length?`<div class="pick">${livres.map(optLivre).join("")}</div>`:'<div class="empty"><div class="em">🚫</div>Nenhuma viatura disponível no momento</div>'}
    ${bloq.length?`<div class="section-title">🟡 Manutenção / indisponíveis (${bloq.length}) <span class="line"></span></div><div class="pick">${bloq.map(optLivre).join("")}</div>`:""}
    ${emUso.length?`<div class="section-title">🔴 Em uso — não podem ser retiradas (${emUso.length}) <span class="line"></span></div>
      <div class="pick">${emUso.map(v=>{ const ab=retiradaAberta(v.id), m=motorista(ab.motoristaId);
        return `<div class="opt" style="opacity:.55;cursor:not-allowed" onclick="alert(msgEmUso(veiculo('${v.id}'),retiradaAberta('${v.id}')))">
          <div class="av">${v.tipo==="Moto"?"🏍️":esc(v.interno.replace("V-",""))}</div>
          <div class="info"><div class="t">${esc(v.interno)} · ${esc(v.placa)}</div>
          <div class="s" style="color:var(--red);font-weight:700">🔴 EM USO — ${esc(m?.nome||ab.motoristaNome||"motorista")} · desde ${dtBR(ab.data)}</div></div></div>`;}).join("")}</div>`:""}
    ${wzNav()}`;
}

function pickVeic(id){
  const v=veiculo(id); if(!v) return;
  const ab=retiradaAberta(id);
  if(ab){ alert(msgEmUso(v,ab)); return; }
  const st=statusVeiculo(v);
  if(st!=="Disponível"){
    if(SESSION.tipo==="motorista"){ alert(v.interno+' está em "'+st+'". Procure o gestor da frota.'); return; }
    if(!confirm(v.interno+' está marcado como "'+st+'".\nLiberar e retirar mesmo assim?')) return;
    v.status="Disponível"; log("Liberou viatura para retirada",v.interno+" ("+st+" → Disponível)"); saveSync(["veiculos","auditoria"]);
  }
  const trocou = WZ.veiculoId!==id;
  WZ.veiculoId=id;
  if(trocou || !WZ.kmInicial) WZ.kmInicial=kmAtual(id)||"";
  wzSave(); stVeiculo($("#wz-body"));
  // alerta de calibragem ao acessar o veículo
  const cs=calibStatus(id);
  if(cs.nivel!=="ok") setTimeout(()=>alert("🛞 "+v.interno+" · "+v.placa+"\n\n"+cs.msg),50);
}

/* etapa 3 - destino (entrada manual) */
function stDestino(b){
  if(WZ.destinoId!=="_outro"){ WZ.destinoId="_outro"; }
  b.innerHTML=`<h3>Para onde?</h3><p class="desc">Informe o destino da saída.</p>
    <label>Destino</label>
    <input id="wz-destoutro" value="${esc(WZ.destinoNome||"")}" placeholder="Ex.: Ronda Centro, Cliente XYZ, Rua...">
    <label style="margin-top:14px">Finalidade da saída</label>
    <input id="wz-finalidade" value="${esc(WZ.finalidade)}" placeholder="Ex.: Ronda, entrega, supervisão...">
    <label style="margin-top:14px">Observações (opcional)</label>
    <textarea id="wz-obs" placeholder="Qualquer informação sobre esta retirada">${esc(WZ.obs||"")}</textarea>
    <button class="btn sec sm" style="width:auto;margin-top:12px" onclick="captureGeo()">📍 Registrar minha localização atual</button>
    <div class="hint" id="geo-hint">${WZ.lat?"✓ Localização registrada":"Opcional — usa a localização no momento da saída, se você autorizar."}</div>
    ${wzNav()}`;
}
function captureGeo(){
  // preserva o que já foi digitado nesta etapa
  const dest=$("#wz-destoutro"); if(dest)WZ.destinoNome=dest.value.trim();
  const fin=$("#wz-finalidade"); if(fin)WZ.finalidade=fin.value.trim();
  const obs=$("#wz-obs"); if(obs)WZ.obs=obs.value.trim();
  wzSave();
  if(!navigator.geolocation){toast("Geolocalização indisponível");return;}
  navigator.geolocation.getCurrentPosition(p=>{
    WZ.lat=p.coords.latitude;WZ.lng=p.coords.longitude;wzSave();
    $("#geo-hint").textContent="✓ Localização registrada";toast("Localização registrada");
  },()=>toast("Não foi possível obter localização"),{timeout:8000});
}

/* etapa 4 - KM inicial */
function stKm(b){
  const kmUlt=kmAtual(WZ.veiculoId);
  b.innerHTML=`<h3>Quilometragem inicial</h3><p class="desc">Informe o KM atual do painel. Última registrada: <b>${fmtKm(kmUlt)}</b></p>
    ${calibAlertaHTML(WZ.veiculoId)}
    <label>KM inicial</label><input id="wz-km" type="number" inputmode="numeric" value="${esc(WZ.kmInicial)}" placeholder="Ex.: 85420">
    <label style="margin-top:14px">Nível de combustível na saída</label>
    <div class="fuel-row">${NIVEL_COMB.map(n=>`<button class="${WZ.nivelComb===n?"on":""}" onclick="setComb('${n}')">${n}</button>`).join("")}</div>
    <label style="margin-top:16px">Foto do painel (opcional aqui, obrigatória na etapa Fotos)</label>
    ${photoSlotHTML("painel","Painel/KM","📊",WZ.fotos.painel)}
    ${wzNav()}`;
  bindPhoto("painel");
}
function setComb(n){ const km=$("#wz-km"); if(km)WZ.kmInicial=km.value.trim(); WZ.nivelComb=n;wzSave();stKm($("#wz-body"));}

/* etapa 5 - checklist */
function stChecklist(b){
  b.innerHTML=`<h3>Checklist inicial</h3><p class="desc">Marque a condição de cada item.</p>
    <div id="chk-list">${CHECKLIST_ITENS.map((it,i)=>chkItemHTML(it,i,WZ.checklist)).join("")}</div>
    ${wzNav()}`;
  CHECKLIST_ITENS.forEach((it,i)=>bindChkPhoto(i));
}
function chkItemHTML(it,i,store){
  const cur=store[i]||{};
  return `<div class="chk-item"><div class="top"><span class="nm">${esc(it)}</span>
    <div class="seg">
      <button class="ok ${cur.v==="ok"?"on":""}" onclick="setChk(${i},'ok')">OK</button>
      <button class="pb ${cur.v==="pb"?"on":""}" onclick="setChk(${i},'pb')">Problema</button>
      <button class="na ${cur.v==="na"?"on":""}" onclick="setChk(${i},'na')">N/A</button>
    </div></div>
    <div class="chk-extra ${cur.v==="pb"?"show":""}" id="chk-ex-${i}">
